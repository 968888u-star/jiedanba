<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f0a020" />
<title>众包接单 · 订单大厅</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f5f6fa;--card:#fff;--ink:#12141d;--ink2:#5b6070;--ink3:#8d93a6;--line:#e8eaf1;--brand:#f0a020;--brand-dark:#d98a10;--brand-soft:#fff9ec;--red:#e02020;--r:12px;}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  input,select,textarea{outline:none}
  .loading{position:fixed;inset:0;background:rgba(245,246,250,.8);display:grid;place-items:center;font-size:14px;color:var(--ink3);z-index:999}
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{background:#fff;border-radius:20px;padding:32px 26px;width:min(420px,100%);box-shadow:0 20px 60px rgba(15,17,26,.12);}
  .auth-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#ffc107,#f0a020);color:#fff;font-size:24px;font-weight:800;display:grid;place-items:center;margin:0 auto 14px;}
  .auth-card h1{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px;letter-spacing:-.3px}
  .auth-sub{font-size:13px;color:var(--ink3);text-align:center;margin-bottom:22px}
  .auth-tabs{display:flex;background:#f5f6fa;border-radius:10px;padding:4px;margin-bottom:22px}
  .auth-tab{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);transition:.16s}
  .auth-tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(15,17,26,.06)}
  .app{display:flex;min-height:100vh}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--card);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;z-index:20;}
  .brand{display:flex;align-items:center;gap:11px;padding:0 6px 20px}
  .brand-logo{width:36px;height:36px;border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,#ffc107,#f0a020);display:grid;place-items:center;color:#fff;font-size:16px;font-weight:800;}
  .brand-name{font-size:15px;font-weight:800}
  .brand-sub{font-size:11px;color:var(--ink3);margin-top:1px}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:var(--ink2);font-size:14px;font-weight:500;text-align:left;width:100%;transition:.16s;}
  .nav-item .ico{font-size:16px;width:18px;text-align:center}
  .nav-item:hover{background:#f4f5fa;color:var(--ink)}
  .nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:700}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  .user-box{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:10px;transition:.16s;text-align:left;}
  .user-box:hover{background:#f4f5fa}
  .avatar{width:32px;height:32px;border-radius:50%;flex:0 0 auto;background:linear-gradient(135deg,#ffc107,#f0a020);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;}
  .user-name{font-size:13px;font-weight:700}
  .user-sub{font-size:11px;color:var(--ink3)}
  .logout-btn{width:100%;margin-top:10px;padding:9px;border-radius:10px;background:#f1f2f7;color:var(--ink2);font-size:12.5px;font-weight:600;transition:.16s;}
  .logout-btn:hover{background:#fee2e2;color:#dc2626}
  .main{margin-left:220px;flex:1;padding:20px 24px 80px;max-width:900px}
  .page{animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .mhead{display:none}
  .order-tabs{display:flex;background:#fff;border-radius:12px 12px 0 0;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;}
  .order-tabs::-webkit-scrollbar{display:none}
  .order-tab{flex:0 0 auto;padding:15px 16px;font-size:14px;font-weight:600;color:var(--ink2);position:relative;white-space:nowrap;transition:.16s;}
  .order-tab.active{color:var(--brand);font-weight:800}
  .order-tab.active::after{content:'';position:absolute;bottom:0;left:16px;right:16px;height:3px;border-radius:3px 3px 0 0;background:var(--brand);}
  .order-list{background:#fff;border-radius:0 0 12px 12px;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
  .order-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;transition:.18s;display:flex;flex-direction:column;cursor:pointer;}
  .order-card:hover{border-color:#ffe0b2;box-shadow:0 4px 16px rgba(240,160,32,.08)}
  .order-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
  .order-no{font-size:12.5px;color:var(--ink2);line-height:1.4;word-break:break-all}
  .order-status{font-size:12.5px;font-weight:700;white-space:nowrap;flex:0 0 auto}
  .status-pending{color:#f0a020}
  .status-confirm{color:#4f46e5}
  .status-paid{color:#10b981}
  .status-paused{color:#8d93a6}
  .status-cancel{color:#c9cddc}
  .order-amounts{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
  .amount-item{display:flex;align-items:baseline;gap:2px}
  .amount-label{font-size:12.5px;color:var(--ink3);margin-right:2px}
  .amount-value{font-size:16px;font-weight:800;letter-spacing:-.3px}
  .amount-value.red{color:var(--red)}
  .amount-value.gold{color:var(--brand)}
  .deposit-tip{font-size:12px;color:#c2410c;background:#fff9ec;border:1px dashed #ffe0b2;border-radius:8px;padding:7px 10px;margin-bottom:10px;}
  .order-info{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .order-info-row{font-size:12.5px;color:var(--ink2);display:flex;gap:6px}
  .order-info-row .label{color:var(--ink3);flex:0 0 auto;min-width:62px}
  .order-info-row .val{color:var(--ink);font-weight:500}
  .order-btn{display:block;width:100%;padding:11px 0;border-radius:10px;font-size:15px;font-weight:800;background:#ffc107;color:#5b4200;transition:.16s;text-align:center;letter-spacing:.5px;}
  .order-btn:hover{background:#f0a020;color:#fff}
  .order-btn.done{background:#f1f2f7;color:var(--ink3);cursor:default;}
  .order-btn.need-deposit{background:#fff4ec;color:#c2410c;border:1px dashed #f0a020}
  .empty{text-align:center;padding:60px 20px;background:#fff;border-radius:12px;border:1px dashed var(--line);margin-top:12px;}
  .empty-ico{font-size:36px;margin-bottom:12px;opacity:.6}
  .empty h3{font-size:15px;font-weight:700;margin-bottom:6px}
  .empty p{font-size:13px;color:var(--ink3)}
  .form-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;max-width:680px}
  .field{display:block;margin-bottom:16px}
  .field-label{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin-bottom:8px}
  .field-label i{color:#ef4444;font-style:normal}
  .input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14.5px;transition:.16s;}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(240,160,32,.12)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:10px;border:1px solid transparent;font-size:14.5px;font-weight:700;transition:.16s;white-space:nowrap;}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink2)}
  .btn-block{width:100%}
  .btn-imtoken{background:linear-gradient(135deg,#2c2c2c,#12141d);color:#fff;}
  .tabbar{display:none}
  .overlay{position:fixed;inset:0;background:rgba(15,17,26,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:#fff;border-radius:16px;width:min(500px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;}
  .modal-head h2{font-size:17px;font-weight:800}
  .icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);font-size:15px}
  .modal-body{padding:0 20px 18px;overflow-y:auto;flex:1}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:#fbfbfe;}
  .detail-price{font-size:28px;font-weight:850;color:var(--red);letter-spacing:-1px;margin:12px 0 4px}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding:14px;background:#f8f9fd;border-radius:12px;margin:14px 0;}
  .dg-item .dg-k{font-size:11.5px;color:var(--ink3);margin-bottom:3px}
  .dg-item .dg-v{font-size:13.5px;font-weight:700;word-break:break-all}
  .detail-desc{font-size:13.5px;color:var(--ink2);line-height:1.7;padding:14px;background:#f8f9fd;border-radius:12px;margin-bottom:14px;white-space:pre-wrap;}
  .notice{padding:12px 14px;border-radius:10px;font-size:13px;background:#fff9ec;color:#c27800;border:1px solid #ffe0b2;display:flex;align-items:center;gap:8px;line-height:1.5;}
  .toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,18px);background:#12141d;color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:.28s;z-index:300;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:calc(100vw - 40px);text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .pm-choice{display:flex;flex-direction:column;gap:8px}
  .pm-choice-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;cursor:pointer;transition:.16s;background:#fff;}
  .pm-choice-item.active{border-color:var(--brand);background:var(--brand-soft);}
  .pm-choice-item input[type="radio"]{accent-color:var(--brand);width:18px;height:18px;margin:0;flex:0 0 auto}
  .pm-choice-info{flex:1;min-width:0}
  .pm-choice-info .t{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:2px}
  .pm-choice-info .s{font-size:11.5px;color:var(--ink3);word-break:break-all}

  /* 浅蓝色按钮（个人资料里的收款方式标签） */
  .pm-btn-blue{display:inline-block;padding:4px 12px;border-radius:8px;font-size:12px;font-weight:700;background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;margin-right:8px;flex:0 0 auto}

  /* 钱包选择卡片 */
  .wallet-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .wallet-card{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:.16s;text-align:left;position:relative;}
  .wallet-card:hover{border-color:#c9cddc}
  .wallet-card.active{border-color:var(--brand);background:var(--brand-soft);}
  .wallet-card .wc-icon{width:36px;height:36px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;}
  .wallet-card .wc-icon.imtoken{background:#0e8aff;}
  .wallet-card .wc-info{flex:1;min-width:0}
  .wallet-card .wc-name{font-size:13.5px;font-weight:800;color:var(--ink)}
  .wallet-card .wc-tip{font-size:11px;color:var(--ink3);margin-top:2px}
  .wallet-card .wc-check{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid #fff;}
  @media (max-width:900px){
    .sidebar{display:none}
    .main{margin-left:0;padding:0 12px 80px;max-width:100%}
    .mhead{display:flex;align-items:center;justify-content:space-between;padding:12px 0 14px;position:sticky;top:0;z-index:15;background:rgba(245,246,250,.95);}
    .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
    .tabbar .nav-item{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:5px 2px;justify-content:center;}
    .tabbar .nav-item .ico{font-size:18px}
    .toast{bottom:80px}
    .overlay{padding:0;align-items:flex-end}
    .modal{width:100%;max-height:90vh;border-radius:16px 16px 0 0;}
    .wallet-choices{grid-template-columns:1fr}
  }
</style>
</head><body>
<div id="app"><div class="loading">加载中…</div></div>
<div id="modal-root"></div>

<script>
/* =========================================================
   全局状态
   ========================================================= */
const TOKEN_KEY = 'jiedan.token';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const state = {
  user: null,
  orders: [],
  refunds: [],
  config: { trc20: '', ratio: 0.1, minDeposit: 10, notice: '', support: '' },
  view: 'hall',
  orderTab: 'hall',
  mineTab: 'working',
  authTab: 'login',
  loading: false,
  pollTimer: null,
  grabChoice: null,
  wallet: 'imtoken',
};

function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch(e) { return null; } }
function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch(e) {} }
function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch(e) {} }

/* =========================================================
   API 请求封装
   ========================================================= */
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  const token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch('/api' + path, {
    method: options.method || 'GET',
    headers,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) {
    if (res.status === 401) { clearToken(); state.user = null; }
    throw new Error(data.error || ('请求失败 ' + res.status));
  }
  return data;
}

/* =========================================================
   工具
   ========================================================= */
const uid = () => Math.random().toString(36).slice(2, 9);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDateTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function timeAgo(ts) {
  const d = Date.now() - ts;
  const m = Math.floor(d / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  return Math.floor(h/24) + ' 天前';
}

let toastTimer = null;
function toast(msg) {
  $$('.toast').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 320);
  }, 2200);
}

/* =========================================================
   收款方式工具（支持新旧格式）
   ========================================================= */
function getPayMethods(u) {
  if (!u || !u.payMethod) return [];
  const pm = u.payMethod;
  if (pm.type) return [pm];
  const arr = [];
  if (pm.alipay) arr.push({ type: 'alipay', ...pm.alipay });
  if (pm.bank) arr.push({ type: 'bank', ...pm.bank });
  return arr;
}
function hasPayMethod(u) {
  return getPayMethods(u).length > 0;
}
function formatPayMethod(pm) {
  if (!pm) return '';
  if (pm.type === 'alipay') return `支付宝 · ${pm.account || ''}`;
  if (pm.type === 'bank') return `银行卡 · ${pm.bank || ''} ${pm.account || ''}`;
  return '';
}

/* =========================================================
   押金计算
   ========================================================= */
function depositRequired(o) {
  const r = Number(state.config.ratio) || 0.1;
  const min = Number(state.config.minDeposit) || 10;
  return Math.max(min, Math.round(Number(o.amount) * r));
}
function hasEnoughDeposit(o) {
  return Number(state.user?.deposit || 0) >= depositRequired(o);
}
const myTaker = o => (o.takers || []).find(x => x.userId === state.user?.id) || null;

/* =========================================================
   数据刷新（防闪屏）
   ========================================================= */
async function refreshAll(silent = false) {
  if (!getToken() || !state.user) return;
  try {
    const [meRes, ordersRes, refundsRes] = await Promise.all([
      api('/me'),
      api('/orders'),
      api('/refunds/mine'),
    ]);

    const oldJson = JSON.stringify({ u: state.user, o: state.orders, r: state.refunds });

    state.user = meRes.user;
    state.orders = ordersRes.orders || [];
    state.refunds = refundsRes.refunds || [];

    const newJson = JSON.stringify({ u: state.user, o: state.orders, r: state.refunds });

    if (!silent) { render(); return; }
    if (oldJson === newJson) return;

    const activeEl = document.activeElement;
    const isTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
    const modalOpen = !!document.querySelector('.overlay');
    if (isTyping || modalOpen) return;

    render();
  } catch (e) {
    if (!silent) toast(e.message);
  }
}

async function loadConfig() {
  try {
    const r = await api('/config');
    state.config = Object.assign(state.config, r.config || {});
  } catch(e) {}
}

/* =========================================================
   初始化
   ========================================================= */
async function bootstrap() {
  await loadConfig();
  const token = getToken();
  if (token) {
    try {
      const meRes = await api('/me');
      state.user = meRes.user;
      const ordersRes = await api('/orders');
      state.orders = ordersRes.orders || [];
      const refundsRes = await api('/refunds/mine');
      state.refunds = refundsRes.refunds || [];
    } catch(e) {
      clearToken();
      state.user = null;
    }
  }
  render();
  if (state.user) startPolling();
}

function startPolling() {
  stopPolling();
  state.pollTimer = setInterval(() => {
    if (document.visibilityState === 'visible' && state.user) {
      refreshAll(true);
    }
  }, 5000);
}
function stopPolling() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}/* =========================================================
   渲染入口
   ========================================================= */
function render() {
  const app = $('#app');
  if (!state.user) {
    app.innerHTML = renderAuth();
  } else {
    app.innerHTML = renderMainApp();
  }
}

/* =========================================================
   认证页（注册去掉昵称）
   ========================================================= */
function renderAuth() {
  const isLogin = state.authTab === 'login';
  return `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">单</div>
      <h1>众包接单</h1>
      <p class="auth-sub">轻松接单 · 快速返佣</p>
      <div class="auth-tabs">
        <button class="auth-tab${isLogin ? ' active' : ''}" data-action="auth-tab" data-tab="login">登录</button>
        <button class="auth-tab${!isLogin ? ' active' : ''}" data-action="auth-tab" data-tab="register">注册</button>
      </div>
      ${isLogin ? `
        <label class="field"><span class="field-label">用户名</span>
          <input class="input" id="login-username" maxlength="20" placeholder="请输入用户名"></label>
        <label class="field"><span class="field-label">密码</span>
          <input class="input" id="login-password" type="password" maxlength="30" placeholder="请输入密码"></label>
        <button class="btn btn-primary btn-block" data-action="do-login" style="margin-top:6px">登 录</button>
      ` : `
        <label class="field"><span class="field-label">用户名 <i>*</i></span>
          <input class="input" id="reg-username" maxlength="20" placeholder="3-20 位字母或数字"></label>
        <label class="field"><span class="field-label">密码 <i>*</i></span>
          <input class="input" id="reg-password" type="password" maxlength="30" placeholder="至少 6 位"></label>
        <label class="field"><span class="field-label">确认密码 <i>*</i></span>
          <input class="input" id="reg-password2" type="password" maxlength="30" placeholder="再次输入密码"></label>
        <button class="btn btn-primary btn-block" data-action="do-register" style="margin-top:6px">注 册</button>
      `}
    </div>
  </div>`;
}

/* =========================================================
   主应用
   ========================================================= */
function renderMainApp() {
  const u = state.user;
  const name = u.username || '我';
  const initial = name.slice(0, 1);
  const viewHtml = ({
    hall: viewHall,

const STATUS_MAP = {
  pending: { text: '待审核', cls: 'status-pending' },
  confirm: { text: '待收款', cls: 'status-confirm' },
  paid: { text: '已收款', cls: 'status-paid' },
  paused: { text: '暂停中', cls: 'status-paused' },
  cancelled: { text: '已取消', cls: 'status-cancel' },
};
const statusOf = s => STATUS_MAP[s] || STATUS_MAP.pending;

function viewHall() {
  const tabs = [
    { id: 'hall', name: '订单大厅' },
    { id: 'confirm', name: '待收款' },
    { id: 'paid', name: '已收款' },
    { id: 'cancelled', name: '已取消' },
  ];
  let list = state.orders.slice();
  if (state.orderTab === 'hall') {
    list = list.filter(o => o.status === 'pending');
  } else {
    list = list.filter(o => o.status === state.orderTab);
  }
  list.sort((a, b) => b.createdAt - a.createdAt);

  const emptyText = state.orderTab === 'hall'
    ? '大厅里暂时没有可接订单'
    : '该分类下还没有订单';

  return `
  <div class="page">
    <div class="order-tabs">
      ${tabs.map(t => `<button class="order-tab${state.orderTab === t.id ? ' active' : ''}" data-action="order-tab" data-tab="${t.id}">${t.name}</button>`).join('')}
    </div>
    <div class="order-list">
      ${list.length ? list.map(orderCard).join('') : `<div class="empty"><div class="empty-ico">📭</div><h3>暂无订单</h3><p>${emptyText}</p></div>`}
    </div>
  </div>`;
}

function orderCard(o) {
  const st = statusOf(o.status);
  const took = !!myTaker(o);
  const canGrab = o.status === 'pending' && !took;
  const required = depositRequired(o);
  const enough = hasEnoughDeposit(o);

  let btnText = '抢单', btnClass = 'order-btn', btnAction = 'grab';
  if (took) { btnText = '已接单'; btnClass += ' done'; btnAction = ''; }
  else if (o.status !== 'pending') { btnText = st.text; btnClass += ' done'; btnAction = ''; }
  else if (!enough) { btnText = `需押金 ${required} USDT · 去充值`; btnClass = 'order-btn need-deposit'; btnAction = 'deposit'; }

  const btnAttr = btnAction ? `data-action="${btnAction}" data-id="${o.id}"` : 'disabled';
  const depositTip = (canGrab && !enough) ? `<div class="deposit-tip">🔒 当前押金 ${state.user.deposit} USDT，抢此单需 ${required} USDT</div>` : '';

  return `
  <div class="order-card" data-action="open" data-id="${o.id}">
    <div class="order-header">
      <div class="order-no">订单号：${esc(o.orderNo)}</div>
      <div class="order-status ${st.cls}">${st.text}</div>
    </div>
    <div class="order-amounts">
      <div class="amount-item"><span class="amount-label">收款金额：</span><span class="amount-value red">${Number(o.amount).toFixed(2)}</span></div>
      <div class="amount-item"><span class="amount-label">返佣金额：</span><span class="amount-value gold">${Number(o.commission).toFixed(2)}</span></div>
    </div>
    ${depositTip}
    <div class="order-info">
      <div class="order-info-row"><span class="label">创建时间：</span><span class="val">${fmtDateTime(o.createdAt)}</span></div>
      <div class="order-info-row"><span class="label">收款类型：</span><span class="val">${esc(o.payType)}</span></div>
    </div>
    <button class="${btnClass}" ${btnAttr}>${btnText}</button>
  </div>`;
}

  if (!o) return;
  if (o.status !== 'pending' || myTaker(o)) { toast('这个订单已经不能抢了'); return; }

  if (!hasPayMethod(state.user)) {
    window.__pendingGrabId = id;
    openPayMethodModal(true);
    return;
  }

  if (!hasEnoughDeposit(o)) { toast(`押金不足，需 ${depositRequired(o)} USDT`); return; }

  const pms = getPayMethods(state.user);
  state.grabChoice = pms.length === 1 ? pms[0].type : (state.grabChoice || pms[0].type);

  const choiceHtml = pms.length === 1 ? `
    <div style="padding:12px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;margin-bottom:14px">
      <div style="font-size:12px;color:#16a34a;margin-bottom:4px">将使用以下收款方式</div>
      <div style="font-size:13.5px;font-weight:700;color:#166534">${esc(formatPayMethod(pms[0]))}</div>
      <div style="font-size:12px;color:#16a34a;margin-top:4px">收款姓名：${esc(pms[0].realName)}</div>
    </div>
  ` : `
    <div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:8px">选择收款方式</div>
      <div class="pm-choice">
        ${pms.map(p => `
          <label class="pm-choice-item${state.grabChoice === p.type ? ' active' : ''}" data-action="pick-pm" data-type="${p.type}">
            <input type="radio" name="grab-pm" value="${p.type}" ${state.grabChoice === p.type ? 'checked' : ''}>
            <div class="pm-choice-info">
              <div class="t">${p.type === 'alipay' ? '💙 支付宝' : '🏦 银行卡'}</div>
              <div class="s">${esc(p.account)}${p.bank ? ' · ' + esc(p.bank) : ''} · ${esc(p.realName)}</div>
            </div>
          </label>
        `).join('')}
      </div>
    </div>
  `;

  openModal(`
    <div class="modal-head"><h2>确认抢单</h2><button class="icon-btn" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      <div style="background:#fff9ec;border:1px solid #ffe0b2;border-radius:12px;padding:16px;text-align:center;margin-bottom:16px">
        <div style="font-size:12px;color:var(--ink3);margin-bottom:6px">订单号：${esc(o.orderNo)}</div>
        <div style="font-size:28px;font-weight:850;color:var(--red);letter-spacing:-1px">${Number(o.amount).toFixed(2)}</div>
        <div style="font-size:13px;color:var(--brand);font-weight:700;margin-top:4px">返佣 ${Number(o.commission).toFixed(2)}</div>
      </div>
      <div class="detail-grid" style="margin:0 0 14px">
        <div class="dg-item"><div class="dg-k">收款类型</div><div class="dg-v">${esc(o.payType)}</div></div>
        <div class="dg-item"><div class="dg-k">本单押金</div><div class="dg-v" style="color:var(--brand)">${depositRequired(o)} USDT</div></div>
      </div>
      ${choiceHtml}
      <div class="notice">⚡ 抢单后请尽快完成，审核通过后返佣自动结算</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-action="close-modal" style="background:#fff;border-color:var(--line)">再想想</button>
      <button class="btn btn-primary" data-action="submit-grab" data-id="${o.id}">确认抢单</button>
    </div>
  `);
}

async function submitGrab(id) {
  try {
    const pms = getPayMethods(state.user);
    const chosen = pms.find(p => p.type === state.grabChoice) || pms[0];
    await api(`/orders/${id}/grab`, { method: 'POST', body: { payMethod: chosen } });
    closeModal();
    state.mineTab = 'working';
    await refreshAll();
    toast('抢单成功，请尽快完成');
  } catch (e) {
    toast(e.message);
  }
}

/* =========================================================
   提交完成
   ========================================================= */
async function submitWork(id) {
  try {
    await api(`/orders/${id}/work`, { method: 'POST' });
    closeModal();
    state.mineTab = 'done';
    await refreshAll();
    toast('订单完成，返佣已到账');
  } catch (e) { toast(e.message); }
}

/* =========================================================
   充值弹窗（钱包图标 & 文案同步更新）
   ========================================================= */
function openDepositModal(order) {
  const required = order ? depositRequired(order) : 0;
  const addr = state.config.trc20;
  openModal(`
    <div class="modal-head"><h2>充值押金</h2><button class="icon-btn" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      ${order ? `<div class="notice" style="margin-bottom:14px">🔒 抢此单需押金 ${required} USDT，当前押金 ${state.user.deposit} USDT</div>` : ''}
      <div style="background:#fff9ec;border:1px solid #ffe0b2;border-radius:12px;padding:14px;margin-bottom:16px">
        <div style="font-size:12.5px;color:var(--ink3)">当前押金余额</div>
        <div style="font-size:22px;font-weight:800;color:var(--brand);margin-top:2px">${state.user.deposit} <span style="font-size:13px">USDT</span></div>
      </div>

      <div style="font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px">选择钱包</div>
      <div class="wallet-choices" style="grid-template-columns:1fr">
        <button class="wallet-card active" data-action="pick-wallet" data-wallet="imtoken">
          <div class="wc-icon imtoken">
            <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#fff" d="M18.6 3.4c-4.8 0-9 2.8-11.4 6.5-1.2 1.9-1.9 3.5-3.7 4.1-.9.3-1.6-.2-1.4-1.2.2-1 1.1-1.9 1.2-3.2.1-1.6-1.2-2.7-2.6-2.4-1.5.3-2.6 1.7-2.5 3.2.1 1.3.9 2.2 2 2.5-.3 2.3 1 4.3 3.2 4.7 2.5.5 4.5-1 5.7-2.7 1.3-1.8 2.3-3.9 4.2-5 .9-.5 2-.7 3.1-.7 1.2 0 2.1.1 2.4.1V3.4h-.2z"/>
            </svg>
          </div>
          <div class="wc-info">
            <div class="wc-name">imToken</div>
            <div class="wc-tip">官方认证 · 推荐使用</div>
          </div>
          <div class="wc-check">✓</div>
        </button>
      </div>

      <div style="font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px;margin-top:14px">充值地址（TRC20）</div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <input class="input" value="${esc(addr)}" readonly style="font-size:12px;flex:1">
        <button class="btn btn-ghost" data-action="copy-addr" style="padding:0 14px;background:#fff;border-color:var(--line)">复制</button>
      </div>
      <label class="field" style="margin-bottom:12px">
        <span class="field-label">充值金额（USDT）</span>
        <input class="input" id="deposit-amount" type="number" min="${state.config.minDeposit}" step="1" value="100">
      </label>
      <button class="btn btn-imtoken btn-block" data-action="pay-imtoken" style="margin-bottom:12px">🦊 一键支付 · 打开 imToken</button>
      <div class="notice">⚠️ ${esc(state.config.notice)}</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-action="close-modal" style="background:#fff;border-color:var(--line)">取消</button>
      <button class="btn btn-primary" data-action="confirm-deposit" data-id="${order ? order.id : ''}">我已完成支付</button>
    </div>
  `);
}

async function submitDeposit(orderId) {
  const amount = Number($('#deposit-amount')?.value) || 0;
  const min = Number(state.config.minDeposit) || 10;
  if (amount < min) { toast(`最低充值 ${min} USDT`); return; }
  try {
    const r = await api('/deposit', { method: 'POST', body: { amount } });
    state.user = r.user;
    closeModal();
    await refreshAll();
    toast(`充值成功，当前押金 ${state.user.deposit} USDT`);
    if (orderId) setTimeout(() => openGrabModal(orderId), 400);
  } catch (e) { toast(e.message); }
}

async function submitDepositDirect(amount) {
  try {
    const r = await api('/deposit', { method: 'POST', body: { amount } });
    state.user = r.user;
    await refreshAll();
    toast(`充值成功，当前押金 ${state.user.deposit} USDT`);
  } catch (e) { toast(e.message); }
}

/* =========================================================
   退款
   ========================================================= */
async function submitRefund() {
  const amount = Number($('#refund-amount')?.value) || 0;
  const address = $('#refund-address')?.value.trim();
  if (amount <= 0) { toast('退款金额不正确'); return; }
  if (!address) { toast('请输入接收退款的地址'); return; }
  try {
    await api('/refund', { method: 'POST', body: { amount, address } });
    await refreshAll();
    toast('退款申请已提交，等待管理员审核');
  } catch (e) { toast(e.message); }
}

/* =========================================================
   订单详情
   ========================================================= */
function openDetail(id) {
  const o = state.orders.find(x => x.id === id);
  if (!o) return;
  const st = statusOf(o.status);
  const tk = myTaker(o);
  const canGrab = o.status === 'pending' && !tk;

  let takersHtml = '';
  if (o.takers && o.takers.length) {
    takersHtml = `
      <div style="font-size:13px;font-weight:800;color:var(--ink3);letter-spacing:.5px;margin:18px 0 10px">接单者</div>
      ${o.takers.map(x => {
        const pm = x.payMethod || {};
        const isSelf = x.userId === state.user.id;
        const text = pm.type === 'alipay' ? `支付宝：${pm.account}` : pm.type === 'bank' ? `银行卡：${pm.bank || ''} ${pm.account}` : '未提供';
        return `
        <div style="padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
            <div class="avatar">${esc((x.userName || '?').slice(0, 1))}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13.5px;font-weight:700">${esc(x.userName)} ${isSelf ? '（我）' : ''}</div>
              <div style="font-size:11.5px;color:var(--ink3);margin-top:3px">${timeAgo(x.at)} 接单</div>
            </div>
            <div style="font-size:13px;font-weight:800;color:var(--brand)">¥${Number(o.commission).toFixed(2)}</div>
          </div>
          ${isSelf ? `<div style="font-size:12px;color:var(--ink2);padding:8px 10px;background:#f8f9fd;border-radius:8px">
            <div>${esc(text)}</div><div style="color:var(--ink3);margin-top:2px">收款姓名：${esc(pm.realName || '')}</div>
          </div>` : `<div style="font-size:12px;color:var(--ink3);padding:8px 10px;background:#f8f9fd;border-radius:8px">仅本人可见</div>`}
        </div>`;
      }).join('')}`;
  }

  let foot = '';
  if (canGrab) {
    foot = `<button class="btn btn-ghost" data-action="close-modal" style="background:#fff;border-color:var(--line)">关闭</button><button class="btn btn-primary" data-action="grab" data-id="${o.id}">立即抢单</button>`;
  } else if (tk && tk.status === 'working') {
    foot = `<button class="btn btn-ghost" data-action="close-modal" style="background:#fff;border-color:var(--line)">关闭</button><button class="btn btn-primary" data-action="submit-work" data-id="${o.id}">提交完成</button>`;
  } else {
    foot = `<div style="flex:1"></div><button class="btn btn-ghost" data-action="close-modal" style="background:#fff;border-color:var(--line)">关闭</button>`;
  }

  openModal(`
    <div class="modal-head">
      <span class="order-status ${st.cls}" style="font-size:13px">${st.text}</span>
      <button class="icon-btn" data-action="close-modal">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12.5px;color:var(--ink3);margin-bottom:6px">订单号：${esc(o.orderNo)}</div>
      <div class="detail-price">${Number(o.amount).toFixed(2)}</div>
      <div style="font-size:14px;font-weight:800;color:var(--brand)">返佣 ${Number(o.commission).toFixed(2)}</div>
      <div class="detail-grid">
        <div class="dg-item"><div class="dg-k">创建时间</div><div class="dg-v">${fmtDateTime(o.createdAt)}</div></div>
        <div class="dg-item"><div class="dg-k">收款类型</div><div class="dg-v">${esc(o.payType)}</div></div>
        <div class="dg-item"><div class="dg-k">发布者</div><div class="dg-v">${esc(o.publisherName)}</div></div>
        <div class="dg-item"><div class="dg-k">本单押金</div><div class="dg-v" style="color:var(--brand)">${depositRequired(o)} USDT</div></div>
      </div>
      ${o.desc ? `<div class="detail-desc">${esc(o.desc)}</div>` : ''}
      ${takersHtml}
    </div>
    <div class="modal-foot">${foot}</div>
  `);
}

/* =========================================================
   一键支付 imToken
   ========================================================= */
function payWithImToken() {
  const to = state.config.trc20;
  const amount = Number($('#deposit-amount')?.value) || 0;
  if (!to) { toast('收款地址未配置'); return; }
  if (amount < 1) { toast('请输入支付金额'); return; }
  const payPageUrl = `${location.origin}/pay.html?address=${encodeURIComponent(to)}&amount=${amount}&chain=trx`;
  const link = `https://connect.token.im/link/navigate/DappView?url=${encodeURIComponent(payPageUrl)}`;
  const a = document.createElement('a');
  a.href = link;
  a.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { try { a.remove(); } catch (e) {} }, 500);
}/* =========================================================
   认证操作
   ========================================================= */
async function doLogin() {
  const username = ($('#login-username')?.value || '').trim();
  const password = $('#login-password')?.value || '';
  if (!username || !password) { toast('请输入用户名和密码'); return; }
  try {
    const r = await api('/auth/login', { method: 'POST', body: { username, password } });
    setToken(r.token);
    state.user = r.user;
    const [ordersRes, refundsRes] = await Promise.all([api('/orders'), api('/refunds/mine')]);
    state.orders = ordersRes.orders || [];
    state.refunds = refundsRes.refunds || [];
    toast('登录成功');
    render();
    startPolling();
    if (!hasPayMethod(state.user)) {
      setTimeout(() => openPayMethodModal(false), 250);
    }
  } catch (e) { toast(e.message); }
}

async function doRegister() {
  const username = ($('#reg-username')?.value || '').trim();
  const password = $('#reg-password')?.value || '';
  const password2 = $('#reg-password2')?.value || '';
  if (!username || !password) { toast('请填写用户名和密码'); return; }
  if (password.length < 6) { toast('密码至少 6 位'); return; }
  if (password !== password2) { toast('两次密码不一致'); return; }
  try {
    const r = await api('/auth/register', {
      method: 'POST',
      body: { username, nickname: username, password }
    });
    setToken(r.token);
    state.user = r.user;
    state.orders = (await api('/orders')).orders || [];
    state.refunds = [];
    toast('注册成功，请绑定收款方式');
    render();
    startPolling();
    setTimeout(() => openPayMethodModal(false), 250);
  } catch (e) { toast(e.message); }
}

async function doLogout() {
  if (!confirm('确定退出登录吗？')) return;
  try { await api('/auth/logout', { method: 'POST' }); } catch(e) {}
  clearToken();
  state.user = null;
  state.orders = [];
  state.refunds = [];
  state.view = 'hall';
  state.orderTab = 'hall';
  state.authTab = 'login';
  stopPolling();
  closeModal();
  render();
}

/* =========================================================
   保存收款方式
   ========================================================= */
async function savePayMethod() {
  const alipayName = ($('#pm-alipay-name')?.value || '').trim();
  const alipayAcc = ($('#pm-alipay-account')?.value || '').trim();
  const bankName = ($('#pm-bank-name')?.value || '').trim();
  const bankAcc = ($('#pm-bank-account')?.value || '').trim();
  const bankBank = ($('#pm-bank-bank')?.value || '').trim();

  const hasAlipay = alipayName || alipayAcc;
  const hasBank = bankName || bankAcc || bankBank;

  if (!hasAlipay && !hasBank) { toast('请至少填写一种收款方式'); return; }

  if (hasAlipay) {
    if (!alipayName) { toast('请填写支付宝收款姓名'); return; }
    if (!alipayAcc) { toast('请填写支付宝账号'); return; }
  }
  if (hasBank) {
    if (!bankName) { toast('请填写银行卡收款姓名'); return; }
    if (!bankAcc) { toast('请填写银行卡号'); return; }
    if (!bankBank) { toast('请填写开户银行'); return; }
  }

  const payMethod = {
    alipay: hasAlipay ? { realName: alipayName, account: alipayAcc } : null,
    bank: hasBank ? { realName: bankName, account: bankAcc, bank: bankBank } : null,
  };

  try {
    const r = await api('/me', { method: 'PATCH', body: { payMethod } });
    state.user = r.user;
    toast('收款方式已保存');
    closeModal();
    render();
    if (currentPmForce && window.__pendingGrabId) {
      const gid = window.__pendingGrabId;
      window.__pendingGrabId = null;
      setTimeout(() => openGrabModal(gid), 300);
    }
  } catch (e) { toast(e.message); }
}

/* =========================================================
   事件代理
   ========================================================= */
document.addEventListener('click', async e => {
  if (e.target.classList && e.target.classList.contains('overlay')) { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id } = el.dataset;

  try {
    switch (action) {
      case 'auth-tab': state.authTab = el.dataset.tab; render(); break;
      case 'do-login': await doLogin(); break;
      case 'do-register': await doRegister(); break;
      case 'logout': await doLogout(); break;

      case 'open-paymethod':
        openPayMethodModal(false);
        break;
      case 'save-paymethod': await savePayMethod(); break;

      case 'pick-pm':
        state.grabChoice = el.dataset.type;
        document.querySelectorAll('.pm-choice-item').forEach(it => {
          const isActive = it.dataset.type === state.grabChoice;
          it.classList.toggle('active', isActive);
          const radio = it.querySelector('input[type="radio"]');
          if (radio) radio.checked = isActive;
        });
        break;

      case 'pick-wallet':
        state.wallet = el.dataset.wallet || 'imtoken';
        document.querySelectorAll('.wallet-card').forEach(c => {
          c.classList.toggle('active', c.dataset.wallet === state.wallet);
        });
        break;

      case 'nav': state.view = el.dataset.view; closeModal(); render(); break;
      case 'open-profile': openProfile(); break;
      case 'open': openDetail(id); break;
      case 'grab': openGrabModal(id); break;
      case 'submit-grab': await submitGrab(id); break;
      case 'submit-work': await submitWork(id); break;
      case 'order-tab': state.orderTab = el.dataset.tab; render(); break;
      case 'mine-tab': state.mineTab = el.dataset.tab; render(); break;
      case 'close-modal': closeModal(); break;
      case 'deposit': openDepositModal(state.orders.find(o => o.id === id)); break;
      case 'pay-imtoken': payWithImToken(); break;
      case 'confirm-deposit': await submitDeposit(el.dataset.id || ''); break;
      case 'manual-confirm-deposit': {
        const amount = Number($('#deposit-amount')?.value) || 0;
        const min = Number(state.config.minDeposit) || 10;
        if (amount < min) { toast(`最低充值 ${min} USDT`); break; }
        await submitDepositDirect(amount);
        break;
      }
      case 'copy-addr': {
        const addr = state.config.trc20;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(addr).then(() => toast('地址已复制'), () => toast('复制失败'));
        }
        break;
      }
      case 'submit-refund': await submitRefund(); break;
    }
  } catch (e) {
    toast(e.message || '操作失败');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter') {
    if (document.activeElement?.id === 'login-username') $('#login-password')?.focus();
    else if (document.activeElement?.id === 'login-password') doLogin();
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.user) refreshAll(true);
});

bootstrap();
</script>
</body>
</html>
