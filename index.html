<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f0a020" />
<title>众包接单 · 订单大厅</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f5f6fa;--card:#fff;--ink:#12141d;--ink2:#5b6070;--ink3:#8d93a6;
    --line:#e8eaf1;--brand:#f0a020;--brand-dark:#d98a10;--brand-soft:#fff9ec;
    --red:#e02020;--ok:#10b981;--r:12px;
  }
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  input,select,textarea{outline:none}
  .app{display:flex;min-height:100vh}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--card);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;z-index:20;}
  .brand{display:flex;align-items:center;gap:11px;padding:0 6px 20px}
  .brand-logo{width:36px;height:36px;border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,#ffc107,#f0a020);display:grid;place-items:center;color:#fff;font-size:16px;font-weight:800;}
  .brand-name{font-size:15px;font-weight:800}
  .brand-sub{font-size:11px;color:var(--ink3);margin-top:1px}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:var(--ink2);font-size:14px;font-weight:500;text-align:left;width:100%;transition:.16s;}
  .nav-item .ico{font-size:16px;width:18px;text-align:center}
  .nav-item:hover{background:#f4f5fa;color:var(--ink)}
  .nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:700}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  .user-box{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:10px;transition:.16s;text-align:left;}
  .user-box:hover{background:#f4f5fa}
  .avatar{width:32px;height:32px;border-radius:50%;flex:0 0 auto;background:linear-gradient(135deg,#ffc107,#f0a020);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;}
  .user-name{font-size:13px;font-weight:700}
  .user-sub{font-size:11px;color:var(--ink3)}
  .main{margin-left:220px;flex:1;padding:20px 24px 80px;max-width:900px}
  .page{animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .mhead{display:none}
  .order-tabs{display:flex;background:#fff;border-radius:12px 12px 0 0;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;}
  .order-tabs::-webkit-scrollbar{display:none}
  .order-tab{flex:0 0 auto;padding:15px 16px;font-size:14px;font-weight:600;color:var(--ink2);position:relative;white-space:nowrap;transition:.16s;}
  .order-tab:hover{color:var(--ink)}
  .order-tab.active{color:var(--brand);font-weight:800}
  .order-tab.active::after{content:'';position:absolute;bottom:0;left:16px;right:16px;height:3px;border-radius:3px 3px 0 0;background:var(--brand);}
  .order-list{background:#fff;border-radius:0 0 12px 12px;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
  .order-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;transition:.18s;display:flex;flex-direction:column;cursor:pointer;}
  .order-card:hover{border-color:#ffe0b2;box-shadow:0 4px 16px rgba(240,160,32,.08)}
  .order-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
  .order-no{font-size:12.5px;color:var(--ink2);line-height:1.4;word-break:break-all}
  .order-status{font-size:12.5px;font-weight:700;white-space:nowrap;flex:0 0 auto}
  .status-pending{color:#f0a020}
  .status-confirm{color:#4f46e5}
  .status-paid{color:#10b981}
  .status-paused{color:#8d93a6}
  .status-cancel{color:#c9cddc}
  .order-amounts{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
  .amount-item{display:flex;align-items:baseline;gap:2px}
  .amount-label{font-size:12.5px;color:var(--ink3);margin-right:2px}
  .amount-value{font-size:16px;font-weight:800;letter-spacing:-.3px}
  .amount-value.red{color:var(--red)}
  .amount-value.gold{color:var(--brand)}
  .deposit-tip{font-size:12px;color:#c2410c;background:#fff9ec;border:1px dashed #ffe0b2;border-radius:8px;padding:7px 10px;margin-bottom:10px;}
  .order-info{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .order-info-row{font-size:12.5px;color:var(--ink2);display:flex;gap:6px}
  .order-info-row .label{color:var(--ink3);flex:0 0 auto;min-width:62px}
  .order-info-row .val{color:var(--ink);font-weight:500}
  .order-btn{display:block;width:100%;padding:11px 0;border-radius:10px;font-size:15px;font-weight:800;background:#ffc107;color:#5b4200;transition:.16s;text-align:center;letter-spacing:.5px;}
  .order-btn:hover{background:#f0a020;color:#fff}
  .order-btn:active{transform:scale(.98)}
  .order-btn.done{background:#f1f2f7;color:var(--ink3);cursor:default;transform:none}
  .order-btn.done:hover{background:#f1f2f7;color:var(--ink3)}
  .order-btn.need-deposit{background:#fff4ec;color:#c2410c;border:1px dashed #f0a020}
  .order-btn.need-deposit:hover{background:#ffe9d6;color:#9a3412}
  .empty{text-align:center;padding:60px 20px;background:#fff;border-radius:12px;border:1px dashed var(--line);margin-top:12px;}
  .empty-ico{font-size:36px;margin-bottom:12px;opacity:.6}
  .empty h3{font-size:15px;font-weight:700;margin-bottom:6px}
  .empty p{font-size:13px;color:var(--ink3)}
  .form-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;max-width:680px}
  .field{display:block;margin-bottom:16px}
  .field-label{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin-bottom:8px}
  .field-label i{color:#ef4444;font-style:normal}
  .input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14.5px;transition:.16s;}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(240,160,32,.12)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:10px;border:1px solid transparent;font-size:14.5px;font-weight:700;transition:.16s;white-space:nowrap;}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink2)}
  .btn-ghost:hover{border-color:#c9cddc;color:var(--ink)}
  .btn-danger{background:#fff;border-color:#fecaca;color:#dc2626}
  .btn-danger:hover{background:#fef2f2}
  .btn-block{width:100%}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:9px}
  .btn-imtoken{background:linear-gradient(135deg,#2c2c2c,#12141d);color:#fff;box-shadow:0 4px 14px rgba(18,20,29,.25);}
  .btn-imtoken:hover{background:linear-gradient(135deg,#3a3a3a,#202124)}
  .tabbar{display:none}
  .overlay{position:fixed;inset:0;background:rgba(15,17,26,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:16px;width:min(500px,100%);max-height:88vh;display:flex;flex-direction:column;animation:pop .24s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 24px 60px rgba(15,17,26,.3);overflow:hidden;}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;flex:0 0 auto}
  .modal-head h2{font-size:17px;font-weight:800}
  .icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);font-size:15px;transition:.16s}
  .icon-btn:hover{background:#f1f2f7;color:var(--ink)}
  .modal-body{padding:0 20px 18px;overflow-y:auto;flex:1}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:#fbfbfe;flex:0 0 auto;}
  .detail-price{font-size:28px;font-weight:850;color:var(--red);letter-spacing:-1px;margin:12px 0 4px}
  .detail-price small{font-size:13px;font-weight:600;color:var(--ink3);margin-left:5px;letter-spacing:0}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding:14px;background:#f8f9fd;border-radius:12px;margin:14px 0;}
  .dg-item .dg-k{font-size:11.5px;color:var(--ink3);margin-bottom:3px}
  .dg-item .dg-v{font-size:13.5px;font-weight:700;word-break:break-all}
  .detail-desc{font-size:13.5px;color:var(--ink2);line-height:1.7;padding:14px;background:#f8f9fd;border-radius:12px;margin-bottom:14px;white-space:pre-wrap;}
  .notice{padding:12px 14px;border-radius:10px;font-size:13px;background:#fff9ec;color:#c27800;border:1px solid #ffe0b2;display:flex;align-items:center;gap:8px;line-height:1.5;}
  .notice-dark{background:#f5f6fa;color:#12141d;border-color:#e8eaf1}
  .chip-cat{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:.16s;}
  .chip-cat.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,18px);background:#12141d;color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:.28s;z-index:300;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:calc(100vw - 40px);text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:900px){
    .sidebar{display:none}
    .main{margin-left:0;padding:0 12px 80px;max-width:100%}
    .mhead{display:flex;align-items:center;justify-content:space-between;padding:12px 0 14px;position:sticky;top:0;z-index:15;background:rgba(245,246,250,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
    .mhead .brand{padding:0}
    .mhead .brand-logo{width:32px;height:32px;border-radius:9px;font-size:15px}
    .mhead .brand-name{font-size:15px}
    .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
    .tabbar .nav-item{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:5px 2px;border-radius:8px;justify-content:center;}
    .tabbar .nav-item .ico{font-size:18px}
    .order-card{padding:12px 14px}
    .order-amounts{margin-bottom:8px}
    .amount-value{font-size:15px}
    .order-btn{font-size:14.5px;padding:10px 0}
    .toast{bottom:80px}
    .form-row{grid-template-columns:1fr}
    .form-card{padding:16px}
    .overlay{padding:0;align-items:flex-end}
    .modal{width:100%;max-height:90vh;border-radius:16px 16px 0 0;}
  }
</style>
</head><body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">单</div>
      <div>
        <div class="brand-name">众包接单</div>
        <div class="brand-sub">订单大厅</div>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-action="nav" data-view="hall"><span class="ico">📋</span>订单大厅</button>
      <button class="nav-item" data-action="nav" data-view="mine"><span class="ico">📥</span>我的接单</button>
      <button class="nav-item" data-action="nav" data-view="deposit"><span class="ico">💰</span>充值押金</button>
      <button class="nav-item" data-action="nav" data-view="refund"><span class="ico">💸</span>押金退款</button>
    </nav>
    <div class="sidebar-foot">
      <button class="user-box" data-action="edit-name">
        <div class="avatar" id="sb-avatar">我</div>
        <div>
          <div class="user-name" id="sb-name">我</div>
          <div class="user-sub" id="sb-sub">押金 0 USDT</div>
        </div>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="mhead">
      <div class="brand">
        <div class="brand-logo">单</div>
        <div class="brand-name">订单大厅</div>
      </div>
      <button class="avatar" data-action="edit-name" id="mh-avatar">我</button>
    </header>
    <div id="view"></div>
  </main>

  <nav class="tabbar">
    <button class="nav-item active" data-action="nav" data-view="hall"><span class="ico">📋</span>大厅</button>
    <button class="nav-item" data-action="nav" data-view="mine"><span class="ico">📥</span>接单</button>
    <button class="nav-item" data-action="nav" data-view="deposit"><span class="ico">💰</span>充值</button>
    <button class="nav-item" data-action="nav" data-view="refund"><span class="ico">💸</span>退款</button>
  </nav>
</div>

<div id="modal-root"></div>

<script>
const LS_KEY = 'order.v10';
const CFG_KEY = 'order.v10.config';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function timeAgo(ts) {
  const d = Date.now() - ts;
  const m = Math.floor(d / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  const dd = Math.floor(h / 24);
  if (dd < 30) return dd + ' 天前';
  return new Date(ts).toLocaleDateString('zh-CN');
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

const DEFAULT_CONFIG = {
  trc20: 'TXk7YbWcWnQPNhSCXC3p4aFb5tHKqMgRzA',
  ratio: 0.1,
  minDeposit: 10,
  notice: '请务必使用 TRC20 网络充值，转账到其他网络将无法到账',
  support: '客服微信：support_usdt',
};

let CONFIG = Object.assign({}, DEFAULT_CONFIG);
function loadConfig() {
  try {
    const raw = localStorage.getItem(CFG_KEY);
    if (raw) CONFIG = Object.assign({}, DEFAULT_CONFIG, JSON.parse(raw));
  } catch (e) {}
}
function saveConfig() {
  try { localStorage.setItem(CFG_KEY, JSON.stringify(CONFIG)); } catch (e) {}
}

const state = {
  user: { id: '', name: '', credit: 100, income: 0, deposit: 0 },
  orders: [],
  refunds: [], // 新增退款记录
  view: 'hall',
  orderTab: 'all',
  mineTab: 'working',
};

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ user: state.user, orders: state.orders, refunds: state.refunds })); } catch (e) {}
}
const getOrder = id => state.orders.find(o => o.id === id);
const myTaker = o => (o.takers || []).find(x => x.userId === state.user.id) || null;

function depositRequired(o) {
  const r = Number(CONFIG.ratio) || 0.1;
  const min = Number(CONFIG.minDeposit) || 10;
  return Math.max(min, Math.round(Number(o.amount) * r));
}
function hasEnoughDeposit(o) {
  return Number(state.user.deposit) >= depositRequired(o);
}

function seedOrders() {
  const now = Date.now();
  const H = 3600000;
  const orderNo = () => '2026' + Math.floor(100000000000 + Math.random() * 900000000000);
  const mk = (o) => Object.assign({
    id: uid(), status: 'pending', takers: [], createdAt: now - H,
    publisherId: 'sys', publisherName: '系统发布', credit: 100,
    orderNo: orderNo(), amount: 100, commission: 10,
    payType: '支付宝固定小额', desc: '按订单要求完成收款操作，审核通过后返佣。',
  }, o);
  return [
    mk({ id: 'o1', orderNo: '20261007025226586812', status: 'pending', amount: 1000, commission: 100, payType: '支付宝固定小额', createdAt: now - 2 * H, publisherName: '林经理', credit: 98, desc: '需确认收款账户状态，操作简单，完成后截图提交审核。' }),
    mk({ id: 'o2', orderNo: '20261007025226586660', status: 'pending', amount: 100, commission: 10, payType: '银行转账', createdAt: now - 6 * H, publisherName: '王财务', credit: 95, desc: '小额银行转账测试，完成后上传转账凭证即可。' }),
  ];
}

function boot() {
  loadConfig();
  let data = null;
  try { data = JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { data = null; }
  if (data && data.user && Array.isArray(data.orders)) {
    state.user = Object.assign({ credit: 100, income: 0, deposit: 0 }, data.user);
    state.orders = data.orders;
    state.refunds = data.refunds || [];
  } else {
    state.user = { id: uid(), name: '', credit: 100, income: 0, deposit: 0 };
    state.orders = seedOrders();
    state.refunds = [];
    save();
  }
  render();
  updateUserUI();
  if (!state.user.name) showWelcome();
}

const STATUS_MAP = {
  pending:   { text: '待审核', cls: 'status-pending' },
  confirm:   { text: '待确认', cls: 'status-confirm' },
  paid:      { text: '已收款', cls: 'status-paid' },
  paused:    { text: '暂停中', cls: 'status-paused' },
  cancelled: { text: '已取消', cls: 'status-cancel' },
};
const statusOf = s => STATUS_MAP[s] || STATUS_MAP.pending;

function viewHall() {
  const tabs = [
    { id: 'all', name: '订单大厅' },
    { id: 'pending', name: '待确认' },
    { id: 'confirm', name: '已收款' },
    { id: 'paused', name: '暂停中' },
    { id: 'cancelled', name: '已取消' },
  ];
  let list = state.orders.slice();
  if (state.orderTab !== 'all') list = list.filter(o => o.status === state.orderTab);
  list.sort((a, b) => b.createdAt - a.createdAt);
  return `
  <div class="page">
    <div class="order-tabs">
      ${tabs.map(t => `<button class="order-tab${state.orderTab === t.id ? ' active' : ''}" data-action="order-tab" data-tab="${t.id}">${t.name}</button>`).join('')}
    </div>
    <div class="order-list">
      ${list.length ? list.map(orderCard).join('') : `<div class="empty"><div class="empty-ico">📭</div><h3>暂无订单</h3><p>该分类下还没有订单</p></div>`}
    </div>
  </div>`;
}

function orderCard(o) {
  const st = statusOf(o.status);
  const mine = o.publisherId === state.user.id;
  const took = !!myTaker(o);
  const canGrab = o.status === 'pending' && !mine && !took;
  const required = depositRequired(o);
  const enough = hasEnoughDeposit(o);

  let btnText = '抢单', btnClass = 'order-btn', btnAction = 'grab';
  if (mine) { btnText = '我发布的'; btnClass += ' done'; btnAction = ''; }
  else if (took) { btnText = '已接单'; btnClass += ' done'; btnAction = ''; }
  else if (o.status !== 'pending') { btnText = st.text; btnClass += ' done'; btnAction = ''; }
  else if (!canGrab) { btnText = '已抢完'; btnClass += ' done'; btnAction = ''; }
  else if (!enough) { btnText = `需押金 ${required} USDT · 去充值`; btnClass = 'order-btn need-deposit'; btnAction = 'deposit'; }

  const btnAttr = btnAction ? `data-action="${btnAction}" data-id="${o.id}"` : 'disabled';
  const depositTip = (canGrab && !enough) ? `<div class="deposit-tip">🔒 当前押金 ${state.user.deposit} USDT，抢此单需 ${required} USDT</div>` : '';

  return `
  <div class="order-card" data-action="open" data-id="${o.id}">
    <div class="order-header">
      <div class="order-no">订单号：${esc(o.orderNo)}</div>
      <div class="order-status ${st.cls}">${st.text}</div>
    </div>
    <div class="order-amounts">
      <div class="amount-item"><span class="amount-label">收款金额：</span><span class="amount-value red">${Number(o.amount).toFixed(2)}</span></div>

function payWithImToken() {
  const to = CONFIG.trc20;
  const amount = Number($('#deposit-amount')?.value) || 0;

  if (!to) { toast('收款地址未配置'); return; }
  if (amount < 1) { toast('请输入支付金额'); return; }

  const payPageUrl = `${location.origin}/pay.html?address=${encodeURIComponent(to)}&amount=${amount}&chain=trx`;
  const imtokenUniversalLink = `https://connect.token.im/link/navigate/DappView?url=${encodeURIComponent(payPageUrl)}`;

  const a = document.createElement('a');
  a.href = imtokenUniversalLink;
  a.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { try { a.remove(); } catch (e) {} }, 500);
}

let toastTimer = null;
function toast(msg) {
  $$('.toast').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 320);
  }, 2200);
}

document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('overlay')) { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id } = el.dataset;

  switch (action) {
    case 'nav': go(el.dataset.view); break;
    case 'open': openDetail(id); break;
    case 'close-modal': closeModal(); break;
    case 'grab': openGrabModal(id); break;
    case 'submit-grab': submitGrab(id); break;
    case 'submit-work': submitWork(id); break;
    case 'order-tab': state.orderTab = el.dataset.tab; render(); break;
    case 'mine-tab': state.mineTab = el.dataset.tab; render(); break;
    case 'edit-name': editName(); break;
    case 'save-name': saveName(); break;
    case 'deposit': openDepositModal(getOrder(id)); break;
    case 'open-deposit': closeModal(); setTimeout(() => openDepositModal(null), 100); break;
    case 'pay-imtoken': payWithImToken(); break;
    case 'copy-addr': {
      const addr = $('#usdt-addr')?.value || '';
      if (!addr) { toast('地址为空'); break; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(addr).then(() => toast('地址已复制'), () => toast('复制失败'));
      } else {
        fallbackCopy(addr); toast('地址已复制');
      }
      break;
    }
    case 'confirm-deposit': submitDeposit(el.dataset.id || ''); break;
    case 'submit-refund': submitRefund(); break; // 新增
  }
});

function fallbackCopy(text) {
  const tmp = document.createElement('textarea');
  tmp.value = text;
  tmp.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(tmp);
  tmp.select();
  try { document.execCommand('copy'); } catch (e) {}
  tmp.remove();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.activeElement?.id === 'welcome-name') saveName();
});

boot();
</script>
</body>
</html>
