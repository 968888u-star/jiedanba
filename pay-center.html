<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f0a020" />
<title>充值中心 · 实时播报</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f5f6fa;--card:#fff;--ink:#12141d;--ink2:#5b6070;--ink3:#8d93a6;--line:#e8eaf1;--brand:#f0a020;--brand-dark:#d98a10;--brand-soft:#fff9ec;--red:#e02020;--green:#10b981;}
  body{font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;min-height:100vh;padding-bottom:40px;}

  /* 顶部横幅 */
  .hero{background:linear-gradient(135deg,#f0a020,#e88a10);color:#fff;padding:28px 20px 60px;text-align:center;position:relative;overflow:hidden;}
  .hero::before{content:'';position:absolute;top:-50%;right:-20%;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.08);}
  .hero::after{content:'';position:absolute;bottom:-40%;left:-10%;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06);}
  .hero-inner{position:relative;z-index:1;max-width:600px;margin:0 auto;}
  .hero-icon{font-size:44px;margin-bottom:8px;display:inline-block;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .hero h1{font-size:24px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;}
  .hero p{font-size:13.5px;opacity:.9;}
  .hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;}
  .hero-stat{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:12px;padding:14px;text-align:center;}
  .hero-stat .num{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:2px;font-variant-numeric:tabular-nums;}
  .hero-stat .lbl{font-size:11.5px;opacity:.85;}

  /* 主体 */
  .main{max-width:600px;margin:-40px auto 0;padding:0 16px;position:relative;z-index:2;}
  .panel{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(15,17,26,.08);padding:20px;margin-bottom:16px;}
  .list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  .list-header h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:livePulse 1.8s infinite;}
  @keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}70%{box-shadow:0 0 0 10px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
  .list-header .badge-count{font-size:11.5px;color:var(--ink3);font-weight:600;background:#f5f6fa;padding:4px 10px;border-radius:20px;}

  /* 记录列表 */
  .records{display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow-y:auto;padding-right:4px;}
  .records::-webkit-scrollbar{width:6px;}
  .records::-webkit-scrollbar-thumb{background:#d9dbe3;border-radius:3px;}
  .record{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#f8f9fd;border-radius:10px;transition:.2s;}
  .record.new{background:linear-gradient(135deg,#fff9ec,#fff4e0);border:1px solid #ffe0b2;box-shadow:0 4px 14px rgba(240,160,32,.15);}
  .record.new .avatar{animation:newPulse 1s ease;}
  @keyframes newPulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
  .record .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffc107,#f0a020);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;flex:0 0 auto;}
  .record .info{flex:1;min-width:0;}
  .record .name{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:2px;}
  .record .time{font-size:11.5px;color:var(--ink3);}
  .record .amount{font-size:16px;font-weight:800;color:var(--red);letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .record .amount small{font-size:11px;font-weight:600;color:var(--ink3);margin-left:2px;}

  /* 底部 */
  .footer{text-align:center;padding:20px;font-size:12px;color:var(--ink3);}
  .footer a{color:var(--brand);text-decoration:none;font-weight:700;}

  /* 加载 */
  .loading{text-align:center;padding:40px;font-size:13px;color:var(--ink3);}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-icon">💳</div>
    <h1>充值中心</h1>
    <p>实时播报最新充值订单</p>
    <div class="hero-stats">
      <div class="hero-stat">
        <div class="num" id="stat-count">--</div>
        <div class="lbl">近1小时充值笔数</div>
      </div>
      <div class="hero-stat">
        <div class="num" id="stat-total">--</div>
        <div class="lbl">近1小时充值金额</div>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="panel">
    <div class="list-header">
      <h2><span class="live-dot"></span>实时充值记录</h2>
      <span class="badge-count" id="record-count">0 / 200</span>
    </div>
    <div class="records" id="records">
      <div class="loading">正在加载…</div>
    </div>
  </div>
  <div class="footer">
    <a href="/">← 返回订单大厅</a>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function timeAgo(ts) {
  const d = Date.now() - ts;
  const sec = Math.floor(d / 1000);
  if (sec < 30) return '刚刚';
  const m = Math.floor(d / 60000);
  if (m < 1) return sec + ' 秒前';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  return Math.floor(h/24) + ' 天前';
}

function fmtAmount(n) {
  return Number(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function fmtTotal(n) {
  if (n >= 10000) return (n / 10000).toFixed(2) + '万';
  return fmtAmount(n);
}

let lastTopId = null;

function renderRecords(records) {
  // 只统计近 1 小时内的记录
  const oneHourAgo = Date.now() - 60 * 60 * 1000;
  const recentRecords = records.filter(r => Number(r.createdAt) >= oneHourAgo);
  const recentCount = recentRecords.length;
  const recentTotal = recentRecords.reduce((s, r) => s + Number(r.amount || 0), 0);

  $('#stat-count').textContent = recentCount;
  $('#stat-total').textContent = '¥' + fmtTotal(recentTotal);
  $('#record-count').textContent = records.length + ' / 200';

  const topId = records[0]?.id || null;
  const isNewTop = topId && topId !== lastTopId;
  lastTopId = topId;

  if (!records.length) {
    $('#records').innerHTML = `<div class="loading">暂无记录</div>`;
    return;
  }

  $('#records').innerHTML = records.map((r, idx) => {
    const isNew = isNewTop && idx === 0;
    const initial = (r.username || '?').slice(0, 1);
    return `
      <div class="record${isNew ? ' new' : ''}">
        <div class="avatar">${esc(initial)}</div>
        <div class="info">
          <div class="name">${esc(r.username)}</div>
          <div class="time">${timeAgo(r.createdAt)}</div>
        </div>
        <div class="amount">¥${fmtAmount(r.amount)}<small>元</small></div>
      </div>
    `;
  }).join('');
}

async function loadRecords(showLoading = false) {
  try {
    const res = await fetch('/api/pay-records');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '加载失败');
    renderRecords(data.records || []);
  } catch (e) {
    if (showLoading) $('#records').innerHTML = `<div class="loading">加载失败：${esc(e.message)}</div>`;
  }
}

loadRecords(true);
setInterval(() => {
  if (document.visibilityState === 'visible') {
    loadRecords(false);
  }
}, 8000);
</script>
</body>
</html>
