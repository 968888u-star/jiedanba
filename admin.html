<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>众包接单 · 管理后台</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f5f6fa;--card:#fff;--ink:#12141d;--ink2:#5b6070;--ink3:#8d93a6;--line:#e8eaf1;--brand:#f0a020;--brand-dark:#d98a10;--brand-soft:#fff9ec;--red:#e02020;--r:12px;}
  body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;padding:20px;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none}
  button{cursor:pointer;border:none;background:none}
  .login-wrap{max-width:400px;margin:80px auto;background:#fff;border-radius:16px;padding:30px;box-shadow:0 20px 60px rgba(15,17,26,.12);text-align:center;}
  .login-wrap h2{font-size:22px;font-weight:800;margin-bottom:6px}
  .login-wrap p{font-size:13.5px;color:var(--ink3);margin-bottom:20px}
  .input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14.5px;transition:.16s;margin-bottom:14px;}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(240,160,32,.12)}
  textarea.input{resize:vertical;min-height:80px;font-family:inherit;line-height:1.6}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:10px;border:1px solid transparent;font-size:14.5px;font-weight:700;transition:.16s;}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink2)}
  .btn-ghost:hover{border-color:#c9cddc;color:var(--ink)}
  .btn-danger{background:#fff;border-color:#fecaca;color:#dc2626}
  .btn-danger:hover{background:#fef2f2}
  .btn-block{width:100%}
  .app-header{max-width:1000px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between;}
  .app-header h1{font-size:20px;font-weight:800}
  .app-header h1 span{font-size:12px;background:#12141d;color:#fff;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle;}
  .tabs{display:flex;gap:8px;max-width:1000px;margin:0 auto 20px;flex-wrap:wrap;}
  .tab{padding:10px 18px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2);transition:.16s;cursor:pointer;}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .container{max-width:1000px;margin:0 auto;}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;}
  .card h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .card h3::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--brand)}
  .table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .table th,.table td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;}
  .table th{color:var(--ink3);font-weight:600;font-size:12.5px;}
  .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:700;}
  .badge-pending{background:#fff9ec;color:#c27800;}
  .badge-success{background:#f0fdf4;color:#16a34a;}
  .badge-danger{background:#fef2f2;color:#dc2626;}
  .badge-gray{background:#f1f2f7;color:#8d93a6;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field-label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px;}
  .field-label i{color:#ef4444;font-style:normal}
  .empty{text-align:center;padding:40px 20px;color:var(--ink3);font-size:14px;}
  .pm-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;background:#eff6ff;color:#2563eb;margin-right:6px}
  .pm-tag.bank{background:#fef3c7;color:#b45309}
  .toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,18px);background:#12141d;color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:.28s;z-index:300;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.25);}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .sub-info{font-size:12px;color:var(--ink3);margin-top:4px;word-break:break-all;line-height:1.5}
  .video-preview{margin-top:10px;border-radius:10px;overflow:hidden;background:#000;max-width:100%;}
  .video-preview video{width:100%;display:block;max-height:280px;background:#000;}
  .icon-preview{width:64px;height:64px;border-radius:12px;background:#0e8aff;display:grid;place-items:center;overflow:hidden;margin-top:10px;}
  .icon-preview img{width:100%;height:100%;object-fit:cover;}
  .feature-item{background:#f8f9fd;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
  .feature-item .feature-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .feature-item .feature-row input{flex:1;margin-bottom:0;}
  .feature-item textarea{margin-bottom:0;}
  @media (max-width:700px){ .form-row{grid-template-columns:1fr;} .table{font-size:12.5px} .table th,.table td{padding:10px 6px} }
</style>
</head>
<body>

<div id="login-view" class="login-wrap">
  <h2>管理员登录</h2>
  <p>请输入管理密码以进入后台</p>
  <input type="password" id="admin-pwd" class="input" placeholder="请输入管理密码">
  <button class="btn btn-primary btn-block" onclick="adminLogin()">登录</button>
</div>

<div id="admin-app" style="display:none">
  <header class="app-header">
    <h1>⚙️ 管理后台 <span>ADMIN</span></h1>
    <button class="btn btn-ghost" onclick="adminLogout()">退出登录</button>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="orders"   onclick="switchTab('orders')">📋 订单管理</button>
    <button class="tab"        data-tab="publish"  onclick="switchTab('publish')">✏️ 发布订单</button>
    <button class="tab"        data-tab="empty"    onclick="switchTab('empty')">⚡ 空放审核</button>
    <button class="tab"        data-tab="refunds"  onclick="switchTab('refunds')">💸 退款审批</button>
    <button class="tab"        data-tab="users"    onclick="switchTab('users')">👥 用户管理</button>
    <button class="tab"        data-tab="settings" onclick="switchTab('settings')">⚙️ 系统设置</button>
  </div>
  <div class="container" id="admin-content"></div>
</div>

<script>
const TOKEN_KEY = 'jiedan.admin.token';
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let state = { orders: [], refunds: [], users: [], emptyList: [], config: {} };
let pollTimer = null;

function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch(e) { return null; } }
function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch(e) {} }
function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch(e) {} }

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDateTime(ts) { const d = new Date(ts); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

async function api(path, options = {}) {
  const headers = {};
  if (!options.isForm) headers['Content-Type'] = 'application/json';
  const token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch('/api' + path, {
    method: options.method || 'GET',
    headers,
    body: options.isForm ? options.body : (options.body ? JSON.stringify(options.body) : undefined),
  });
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) {
    if (res.status === 403 || res.status === 401) {
      clearToken();
      document.getElementById('login-view').style.display = 'block';
      document.getElementById('admin-app').style.display = 'none';
    }
    throw new Error(data.error || ('请求失败 ' + res.status));
  }
  return data;
}

async function adminLogin() {
  const pwd = $('#admin-pwd').value;
  if (!pwd) { toast('请输入密码'); return; }
  try {
    const r = await api('/admin/login', { method: 'POST', body: { password: pwd } });
    setToken(r.token);
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('admin-app').style.display = 'block';
    await loadAll();
    renderTab('orders');
    startPolling();
    setTimeout(() => autoFill(), 500);
  } catch (e) { toast(e.message); }
}

async function adminLogout() { clearToken(); stopPolling(); location.reload(); }

async function loadAll() {
  const [ordersRes, refundsRes, usersRes, configRes, emptyRes] = await Promise.all([
    api('/admin/orders'), api('/admin/refunds'), api('/admin/users'), api('/config'), api('/admin/empty')
  ]);
  state.orders = ordersRes.orders || [];
  state.refunds = refundsRes.refunds || [];
  state.users = usersRes.users || [];
  state.config = configRes.config || {};
  state.emptyList = emptyRes.list || [];
}

async function autoFill(silent = true) {
  try {
    const r = await api('/admin/auto-fill', { method: 'POST' });
    if (!silent) toast(`补单完成：新增 ${r.added || 0} 条，当前 ${r.total || 0} 条`);
    return r;
  } catch (e) { if (!silent) toast('补单失败：' + e.message); return null; }
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    if (document.visibilityState !== 'visible') return;
    const activeEl = document.activeElement;
    if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) return;
    const activeTab = document.querySelector('.tab.active')?.dataset.tab;
    if (activeTab === 'settings') return;
    try {
      const oldJson = JSON.stringify(state);
      await loadAll();
      if (oldJson === JSON.stringify(state)) return;
      renderTab(activeTab || 'orders');
    } catch(e) {}
  }, 5000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

function switchTab(tab) {
  $$('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  renderTab(tab);
}
function renderTab(tab) {
  const el = document.getElementById('admin-content');
  if (tab === 'orders')   return renderOrders(el);
  if (tab === 'publish')  return renderPublish(el);
  if (tab === 'empty')    return renderEmpty(el);
  if (tab === 'refunds')  return renderRefunds(el);
  if (tab === 'users')    return renderUsers(el);
  if (tab === 'settings') return renderSettings(el);
}

function renderEmpty(el) {
  const list = state.emptyList.slice().sort((a,b) => b.created_at - a.created_at);
  if (!list.length) { el.innerHTML = `<div class="card"><div class="empty">暂无空放码申请</div></div>`; return; }
  el.innerHTML = `
    <div class="card">
      <h3>空放码审核（${list.length}）</h3>
      <table class="table">
        <thead><tr><th>用户</th><th>状态</th><th>空放码</th><th>申请时间</th><th>操作</th></tr></thead>
        <tbody>
          ${list.map(r => `
            <tr>
              <td><div style="font-weight:700">@${esc(r.nickname || r.username || '-')}</div></td>
              <td><span class="badge ${r.status === 'pending' ? 'badge-pending' : r.status === 'approved' ? 'badge-success' : 'badge-gray'}">${r.status === 'pending' ? '待审核' : r.status === 'approved' ? '已通过' : '已使用'}</span></td>
              <td style="font-weight:800; color:var(--red); font-size:16px; letter-spacing:1px;">${r.code || '-'}</td>
              <td style="font-size:12px;color:var(--ink3)">${fmtDateTime(r.created_at)}</td>
              <td>${r.status === 'pending' ? `<button class="btn btn-primary" style="padding:4px 10px;font-size:12px;" onclick="approveEmpty('${r.id}')">审核通过并出码</button>` : ''}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`;
}

async function approveEmpty(id) {
  if (!confirm('确定要通过审核并生成空放码吗？')) return;
  try {
    const r = await api('/admin/empty/approve', { method: 'POST', body: { id } });
    toast('审核通过，生成空放码：' + r.code);
    await loadAll(); renderTab('empty');
  } catch(e) { toast(e.message); }
}

function renderOrders(el) {
  const list = state.orders.slice().sort((a,b) => b.createdAt - a.createdAt);
  const pendingCount = state.orders.filter(o => o.status === 'pending').length;
  el.innerHTML = `
    <div class="card">
      <h3>所有订单（大厅待审核 ${pendingCount} 条 / 目标 30 条）</h3>
      <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="manualFill()" style="padding:8px 14px;font-size:13px">🔄 一键补单到 30 条</button>
        <button class="btn btn-danger" onclick="clearAllOrders()" style="padding:8px 14px;font-size:13px">🗑️ 删除全部订单</button>
      </div>
      ${!list.length ? '<div class="empty">暂无订单</div>' : `
      <table class="table">
        <thead><tr><th>订单号</th><th>金额/佣金</th><th>接单者 & 收款方式</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>
          ${list.map(o => {
            const takers = (o.takers || []).map(t => {
              const pm = t.payMethod || {};
              const tag = pm.type === 'alipay' ? '支付宝' : pm.type === 'bank' ? '银行卡' : '未填';
              return `<div style="margin-bottom:8px"><span class="pm-tag ${pm.type === 'bank' ? 'bank' : ''}">${tag}</span><span style="font-weight:700;font-size:13px">${esc(t.userName)}</span><div class="sub-info">账号：${esc(pm.account || '-')}${pm.bank ? ' · ' + esc(pm.bank) : ''}<br>收款姓名：${esc(pm.realName || '-')}</div></div>`;
            }).join('') || '<span style="color:var(--ink3);font-size:12px">暂无接单</span>';
            return `<tr>
              <td style="font-size:12px;word-break:break-all;">${esc(o.orderNo)}</td>
              <td><span style="color:#e02020;font-weight:700">${o.amount}</span> / <span style="color:#f0a020;font-weight:700">${o.commission}</span></td>
              <td style="max-width:240px">${takers}</td>
              <td><span class="badge ${o.status === 'pending' ? 'badge-pending' : o.status === 'paid' ? 'badge-success' : o.status === 'cancelled' ? 'badge-gray' : 'badge-danger'}">${o.status}</span></td>
              <td>
                ${o.status !== 'paid' ? `<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px;margin-bottom:4px" onclick="updateOrderStatus('${o.id}','paid')">标记已收款</button><br>` : ''}
                ${o.status !== 'cancelled' ? `<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px;margin-bottom:4px" onclick="updateOrderStatus('${o.id}','cancelled')">取消</button><br>` : ''}
                <button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="deleteOrder('${o.id}')">🗑️ 删除</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>`;
}
async function updateOrderStatus(id, status) { try { await api('/admin/orders/' + id, { method: 'PATCH', body: { status } }); toast('状态已更新'); await loadAll(); renderTab('orders'); } catch(e) { toast(e.message); } }
async function deleteOrder(id) { if (!confirm('确定删除此订单？删除后无法恢复')) return; try { await api('/admin/orders/' + id, { method: 'DELETE' }); toast('订单已删除'); await loadAll(); renderTab('orders'); } catch(e) { toast(e.message); } }
async function clearAllOrders() { if (!confirm('⚠️ 确定删除全部订单？')) return; if (!confirm('再次确认：删除全部订单？')) return; try { const ids = state.orders.map(o => o.id); if (!ids.length) { toast('当前没有订单'); return; } for (const oid of ids) { await api('/admin/orders/' + oid, { method: 'DELETE' }); } toast('已删除全部订单'); await loadAll(); renderTab('orders'); } catch(e) { toast(e.message); } }
async function manualFill() { const r = await autoFill(false); if (r) { await loadAll(); renderTab('orders'); } }

function renderPublish(el) {
  el.innerHTML = `
    <div class="card">
      <h3>发布新订单</h3>
      <label class="field-label">收款金额（元）<i>*</i></label>
      <input class="input" id="pub-amount" type="number" min="0.01" step="0.01" placeholder="例如：1000.00">
      <label class="field-label">返佣金额（元）<i>*</i></label>
      <input class="input" id="pub-commission" type="number" min="0.01" step="0.01" placeholder="自动计算">
      <div class="form-row">
        <div><label class="field-label">收款类型 <i>*</i></label><select class="input" id="pub-paytype"><option value="支付宝固定小额">支付宝固定小额</option><option value="银行转账">银行转账</option><option value="微信收款码">微信收款码</option><option value="其他方式">其他方式</option></select></div>
        <div><label class="field-label">订单号</label><input class="input" value="系统自动生成" disabled></div>
      </div>
      <label class="field-label">订单备注</label>
      <textarea class="input" id="pub-desc" rows="3" placeholder="补充说明..."></textarea>
      <button class="btn btn-primary btn-block" onclick="adminSubmitPost()" style="margin-top:16px;">确认发布</button>
    </div>`;
  const amountEl = $('#pub-amount'); const commissionEl = $('#pub-commission');
  amountEl.addEventListener('input', () => { const amt = Number(amountEl.value) || 0; if (amt > 0) commissionEl.value = Math.round(amt * 0.08 * 100) / 100; else commissionEl.value = ''; });
}
async function adminSubmitPost() {
  const amount = Number($('#pub-amount')?.value) || 0; const commission = Number($('#pub-commission')?.value) || Math.round(amount * 0.08); const payType = $('#pub-paytype')?.value || ''; const desc = $('#pub-desc')?.value.trim() || '';
  if (amount <= 0) { toast('请填写金额'); return; }
  try { await api('/admin/orders', { method: 'POST', body: { amount, commission, payType, desc } }); toast('订单发布成功 🎉'); await loadAll(); switchTab('orders'); } catch(e) { toast('发布失败：' + e.message); }
}

function renderRefunds(el) {
  const list = state.refunds.slice().sort((a,b) => b.createdAt - a.createdAt);
  if (!list.length) { el.innerHTML = `<div class="card"><div class="empty">暂无退款申请</div></div>`; return; }
  el.innerHTML = `
    <div class="card">
      <h3>退款审批（${list.length}）</h3>
      <table class="table">
        <thead><tr><th>用户</th><th>金额</th><th>接收地址</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>
          ${list.map(r => `<tr><td>${esc(r.userName)}</td><td style="font-weight:700;color:var(--brand)">${r.amount} USDT</td><td style="font-size:12px;word-break:break-all;">${esc(r.address)}</td><td style="font-size:12px;color:var(--ink3)">${fmtDateTime(r.createdAt)}</td><td><span class="badge ${r.status === 'pending' ? 'badge-pending' : r.status === 'approved' ? 'badge-success' : 'badge-gray'}">${r.status === 'pending' ? '待审核' : r.status === 'approved' ? '已同意' : '已拒绝'}</span></td><td>${r.status === 'pending' ? `<button class="btn btn-primary" style="padding:4px 10px;font-size:12px;" onclick="approveRefund('${r.id}')">同意打款</button><button class="btn btn-danger" style="padding:4px 10px;font-size:12px;" onclick="rejectRefund('${r.id}')">拒绝</button>` : ''}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}
async function approveRefund(id) { const r = state.refunds.find(x => x.id === id); if (!r) return; if (!confirm(`确认向 ${r.address} 打款 ${r.amount} USDT 吗？`)) return; try { await api(`/admin/refunds/${id}/approve`, { method: 'POST' }); toast('已同意退款'); await loadAll(); renderTab('refunds'); } catch(e) { toast(e.message); } }
async function rejectRefund(id) { if (!confirm('确定拒绝该退款申请吗？')) return; try { await api(`/admin/refunds/${id}/reject`, { method: 'POST' }); toast('已拒绝退款'); await loadAll(); renderTab('refunds'); } catch(e) { toast(e.message); } }

function renderUsers(el) {
  if (!state.users.length) { el.innerHTML = `<div class="card"><div class="empty">暂无注册用户</div></div>`; return; }
  el.innerHTML = `<div class="card"><h3>注册用户（${state.users.length}）</h3><table class="table"><thead><tr><th>用户名</th><th>邀请码 / 邀请人</th><th>收款方式</th><th>押金 / 收入</th><th>注册时间</th></tr></thead><tbody>${state.users.slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).map(u => { const pms = []; const pm = u.payMethod || {}; if (pm.type === 'alipay') pms.push({ type:'alipay', ...pm }); else if (pm.type === 'bank') pms.push({ type:'bank', ...pm }); else { if (pm.alipay) pms.push({ type:'alipay', ...pm.alipay }); if (pm.bank) pms.push({ type:'bank', ...pm.bank }); } const pmHtml = pms.length ? pms.map(p => `<div style="margin-bottom:6px"><span class="pm-tag ${p.type === 'bank' ? 'bank' : ''}">${p.type === 'alipay' ? '支付宝' : '银行卡'}</span><span style="font-weight:700">${esc(p.realName || '')}</span><div class="sub-info">账号：${esc(p.account || '')}${p.bank ? ' · ' + esc(p.bank) : ''}</div></div>`).join('') : '<span class="badge badge-gray">未填写</span>'; return `<tr><td><div style="font-weight:700">@${esc(u.username)}</div></td><td><div style="font-weight:700;color:var(--brand);letter-spacing:1px">${esc(u.inviteCode || '-')}</div><div class="sub-info">邀请人：${esc(u.invitedBy === 'root' ? '一级(888888)' : (u.invitedBy || '-'))}</div></td><td style="max-width:240px">${pmHtml}</td><td><div style="font-weight:700;color:var(--brand)">${u.deposit || 0} USDT</div><div class="sub-info">收入 ¥${u.income || 0}</div></td><td style="font-size:12px;color:var(--ink3)">${u.createdAt ? fmtDateTime(u.createdAt) : '-'}</td></tr>`; }).join('')}</tbody></table></div>`;
}

function renderSettings(el) {
  const c = state.config || {};
  const walletIconUrl = c.walletIconUrl || '';
  const loginLogoUrl = c.loginLogoUrl || '';
  const emptyTrc20 = c.emptyTrc20 || '';
  const featureList = c.featureList || [];
  const linkList = Array.isArray(c.linkList) ? c.linkList : [];

  el.innerHTML = `
    <div class="card">
      <h3>押金收款地址</h3>
      <label class="field-label">TRC20 地址（波场网络）</label>
      <input class="input" id="cfg-trc20" value="${esc(c.trc20 || '')}">
    </div>
    <div class="card">
      <h3>空放专属收款地址</h3>
      <label class="field-label">TRC20 地址（波场网络）</label>
      <input class="input" id="cfg-empty-trc20" value="${esc(emptyTrc20)}" placeholder="留空则默认使用上方押金收款地址">
      <div class="sub-info">填写后，内部空放通道的 1 USDT 支付将独立转入此地址。</div>
    </div>
    <div class="card">
      <h3>押金规则</h3>
      <div class="form-row">
        <div><label class="field-label">押金比例（%）</label><input class="input" id="cfg-ratio" type="number" value="${Math.round((Number(c.ratio)||0.1) * 100)}"></div>
        <div><label class="field-label">最低押金（USDT）</label><input class="input" id="cfg-min" type="number" value="${c.minDeposit || 10}"></div>
      </div>
    </div>
    <div class="card">
      <h3>钱包图标（imToken）</h3>
      <label class="field-label">图标 URL（留空使用默认）</label>
      <input class="input" id="cfg-wallet-icon" value="${esc(walletIconUrl)}">
      <div class="icon-preview" id="wallet-icon-preview">${walletIconUrl ? `<img src="${esc(walletIconUrl)}">` : `<span style="color:#fff;font-size:12px;">默认</span>`}</div>
    </div>
    <div class="card">
      <h3>登录页顶部 Logo</h3>
      <label class="field-label">Logo 图片 URL</label>
      <input class="input" id="cfg-login-logo" value="${esc(loginLogoUrl)}">
      <div class="icon-preview" id="login-logo-preview" style="background:#fff; border:1px solid #eee;">${loginLogoUrl ? `<img src="${esc(loginLogoUrl)}">` : `<div style="width:100%;height:100%;background:linear-gradient(135deg,#ffc107,#f0a020);color:#fff;font-size:24px;font-weight:800;display:grid;place-items:center;">单</div>`}</div>
    </div>
    <div class="card">
      <h3>集团介绍配置</h3>
      <label class="field-label">Tab 名称</label>
      <input class="input" id="cfg-tab-cancel" value="${esc(c.tabCancelName || '集团介绍')}">
      <label class="field-label" style="margin-top:6px">宣传视频</label>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <input type="file" id="video-file" accept="video/*" style="font-size:13px;flex:1;min-width:200px">
        <button class="btn btn-primary" onclick="uploadVideo()" style="padding:9px 16px;font-size:13px">⬆️ 上传视频</button>
      </div>
      <input class="input" id="cfg-video-url" value="${esc(c.videoUrl || '')}">
      ${c.videoUrl ? `<div class="video-preview"><video src="${esc(c.videoUrl)}" controls></video></div>` : ''}
      <label class="field-label" style="margin-top:14px">简介标题</label>
      <input class="input" id="cfg-about-title" value="${esc(c.aboutTitle || '企业简介')}">
      <label class="field-label" style="margin-top:6px">简介文案</label>
      <textarea class="input" id="cfg-about" rows="4">${esc(c.aboutText || '')}</textarea>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="margin-bottom:0">跳转按钮组</h3><button class="btn btn-primary" onclick="addLinkItem()" style="padding:8px 14px;font-size:13px">➕ 添加链接</button></div>
      <label class="field-label">卡片名称</label><input class="input" id="cfg-link-card-title" value="${esc(c.linkCardTitle || '')}">
      <div id="link-list-editor">${linkList.map((item, idx) => `<div class="feature-item" data-idx="${idx}"><div class="feature-row"><input class="input link-title" value="${esc(item.title || '')}"><button class="btn btn-danger" onclick="removeLinkItem(${idx})">删除</button></div><input class="input link-url" value="${esc(item.url || '')}" style="margin-top:8px"></div>`).join('')}</div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="margin-bottom:0">折叠功能说明</h3><button class="btn btn-primary" onclick="addFeatureItem()" style="padding:8px 14px;font-size:13px">➕ 添加折叠项</button></div>
      <div id="feature-list-editor">${featureList.map((item, idx) => `<div class="feature-item" data-idx="${idx}"><div class="feature-row"><input class="input feature-title" value="${esc(item.title || '')}"><div style="display:flex; gap:4px; flex:0 0 auto;"><button class="btn btn-ghost" style="padding:6px 8px;" onclick="moveFeatureUp(${idx})" ${idx===0?'disabled':''}>⬆️</button><button class="btn btn-ghost" style="padding:6px 8px;" onclick="moveFeatureDown(${idx})" ${idx===featureList.length-1?'disabled':''}>⬇️</button><button class="btn btn-danger" style="padding:6px 8px;" onclick="removeFeatureItem(${idx})">删</button></div></div><textarea class="input feature-content" rows="3">${esc(item.content || '')}</textarea></div>`).join('')}</div>
    </div>
    <div class="card"><h3>提示文案</h3><label class="field-label">充值页提示</label><input class="input" id="cfg-notice" value="${esc(c.notice || '')}"><label class="field-label">客服信息</label><input class="input" id="cfg-support" value="${esc(c.support || '')}"></div>
    <button class="btn btn-primary btn-block" onclick="saveAdminConfig()">保存全部配置</button>
  `;

  const iconInput = $('#cfg-wallet-icon');
  if (iconInput) iconInput.addEventListener('input', () => { const url = iconInput.value.trim(); const box = $('#wallet-icon-preview'); if (box) box.innerHTML = url ? `<img src="${esc(url)}">` : `<span style="color:#fff;font-size:12px;">默认</span>`; });
  const loginIconInput = $('#cfg-login-logo');
  if (loginIconInput) loginIconInput.addEventListener('input', () => { const url = loginIconInput.value.trim(); const box = $('#login-logo-preview'); if (box) box.innerHTML = url ? `<img src="${esc(url)}">` : `<div style="width:100%;height:100%;background:linear-gradient(135deg,#ffc107,#f0a020);color:#fff;font-size:24px;font-weight:800;display:grid;place-items:center;">单</div>`; });
}

function syncFeatureList() { const featureItems = document.querySelectorAll('#feature-list-editor .feature-item'); const featureList = []; featureItems.forEach(item => { featureList.push({ title: item.querySelector('.feature-title')?.value || '', content: item.querySelector('.feature-content')?.value || '' }); }); state.config.featureList = featureList; }
function addFeatureItem() { syncFeatureList(); state.config.featureList = state.config.featureList || []; state.config.featureList.push({ title: '', content: '' }); renderTab('settings'); }
function removeFeatureItem(idx) { syncFeatureList(); state.config.featureList.splice(idx, 1); renderTab('settings'); }
function moveFeatureUp(idx) { if (idx <= 0) return; syncFeatureList(); const list = state.config.featureList; [list[idx - 1], list[idx]] = [list[idx], list[idx - 1]]; renderTab('settings'); }
function moveFeatureDown(idx) { syncFeatureList(); const list = state.config.featureList; if (idx >= list.length - 1) return; [list[idx + 1], list[idx]] = [list[idx], list[idx + 1]]; renderTab('settings'); }
function addLinkItem() { state.config.linkList = state.config.linkList || []; state.config.linkList.push({ title: '', url: '' }); renderTab('settings'); }
function removeLinkItem(idx) { state.config.linkList.splice(idx, 1); renderTab('settings'); }

async function uploadVideo() {
  const file = $('#video-file')?.files?.[0]; if (!file) { toast('请先选择视频'); return; }
  const formData = new FormData(); formData.append('video', file);
  try { const r = await api('/admin/upload-video', { method: 'POST', body: formData, isForm: true }); $('#cfg-video-url').value = r.url || ('/api/video/' + r.key); toast('上传成功 ✅'); } catch(e) { toast('上传失败：' + e.message); }
}

async function saveAdminConfig() {
  syncFeatureList();
  const linkList = []; document.querySelectorAll('#link-list-editor .feature-item').forEach(item => { const t = item.querySelector('.link-title')?.value.trim(); const u = item.querySelector('.link-url')?.value.trim(); if (t && u) linkList.push({ title: t, url: u }); });
  const body = {
    trc20: $('#cfg-trc20')?.value.trim() || '',
    emptyTrc20: $('#cfg-empty-trc20')?.value.trim() || '',
    ratio: (Number($('#cfg-ratio')?.value) || 10) / 100,
    minDeposit: Number($('#cfg-min')?.value) || 10,
    notice: $('#cfg-notice')?.value.trim() || '',
    support: $('#cfg-support')?.value.trim() || '',
    tabCancelName: $('#cfg-tab-cancel')?.value.trim() || '集团介绍',
    videoUrl: $('#cfg-video-url')?.value.trim() || '',
    aboutTitle: $('#cfg-about-title')?.value.trim() || '企业简介',
    aboutText: $('#cfg-about')?.value || '',
    featureList: state.config.featureList,
    linkCardTitle: $('#cfg-link-card-title')?.value.trim() || '',
    linkList: linkList,
    walletIconUrl: $('#cfg-wallet-icon')?.value.trim() || '',
    loginLogoUrl: $('#cfg-login-logo')?.value.trim() || '' 
  };
  try { await api('/admin/config', { method: 'POST', body }); toast('配置已保存 ✅'); await loadAll(); renderTab('settings'); } catch(e) { toast(e.message); }
}

let toastTimer = null;
function toast(msg) { document.querySelectorAll('.toast').forEach(el => el.remove()); const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); requestAnimationFrame(() => el.classList.add('show')); clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 320); }, 2200); }

(async () => { if (getToken()) { try { await loadAll(); document.getElementById('login-view').style.display = 'none'; document.getElementById('admin-app').style.display = 'block'; renderTab('orders'); startPolling(); } catch(e) { clearToken(); } } })();
</script>
</body>
</html>
